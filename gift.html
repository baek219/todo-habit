<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>경조사 장부 · 생활노트</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#F3F4F6" />
<link rel="stylesheet" href="life.css?v=20261009q" />
<script>try{if(localStorage.getItem('dark_mode_v1')==='1')document.documentElement.classList.add('ln-dark')}catch(e){}</script>
<style>
  .amount-input{font-size:22px!important;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
  .person{display:grid;gap:4px}
  .person .row b{font-size:16px}
  .flow{display:flex;gap:14px;font-size:13.5px;font-variant-numeric:tabular-nums}
  .give{color:var(--danger)} .get{color:var(--good)}
  .tx{cursor:pointer}
  .tx:hover{background:var(--surface2)}
  .tx .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dir-say{margin:0;font-size:14px;font-weight:650;padding:10px 12px;border-radius:12px;background:var(--surface2)}
  .dir-say.give{color:var(--danger);background:#FFF1F1}
  .dir-say.get{color:var(--good);background:#E6F6EF}
  html.ln-dark .dir-say.give{background:#3A1E1E} html.ln-dark .dir-say.get{background:#15332A}
  .tabs{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .tabs button{padding:11px 14px;font-size:15.5px}
  .search{font-size:17px!important;padding:14px 16px!important}
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <span class="date" id="today"></span>
    <h1>경조사 장부</h1>
    <p>내가 낸 돈과 받은 돈을 기록하고, 이름·관계·날짜·금액 아무거나로 찾아볼 수 있어요.</p>
  </header>

  <div class="seg tabs" role="tablist" aria-label="기록하기·찾기">
    <button type="button" role="tab" id="tab-rec" aria-pressed="true" aria-selected="true">기록하기</button>
    <button type="button" role="tab" id="tab-find" aria-pressed="false" aria-selected="false">찾기</button>
  </div>

  <section class="card" id="find-pane" hidden>
    <h2>찾기</h2>
    <input id="q" class="search" type="search" placeholder="이름, 관계, 날짜, 금액… 아무거나" aria-label="찾을 말" autocomplete="off" />
    <div class="chips" id="q-dir"></div>
    <p class="small muted" style="margin:0">예) <b>친구</b> · <b>결혼</b> · <b>2025</b> · <b>11월</b> · <b>2025.11.1</b> · <b>10만</b> · <b>김민수</b> — 띄어 쓰면 모두 들어간 기록만 찾아요 (예: <b>회사 장례</b>).</p>
    <div class="stat-row" id="q-sum"></div>
  </section>

  <section class="card" id="rec-pane">
    <div class="card-head"><h2>기록하기</h2>
      <div class="seg" role="group" aria-label="낸 돈·받은 돈">
        <button type="button" id="d-give" aria-pressed="true">내가 냈어요</button>
        <button type="button" id="d-get" aria-pressed="false">내가 받았어요</button>
      </div></div>
    <form id="form" class="stack" autocomplete="off" style="gap:12px">
      <div class="grid2" style="gap:10px">
        <label class="field"><span class="label">누구</span><input id="f-name" type="text" maxlength="20" placeholder="예: 김민수" list="names" /></label>
        <label class="field"><span class="label">금액 (원)</span><input id="f-amt" class="amount-input" type="text" inputmode="numeric" placeholder="0" /></label>
      </div>
      <datalist id="names"></datalist>
      <p class="dir-say" id="say" aria-live="polite"></p>
      <div class="chips" id="quick"></div>
      <div class="field"><span class="label">관계</span><div id="f-rel"></div></div>
      <div class="field"><span class="label">무슨 일</span><div id="f-ev"></div></div>
      <div class="grid2" style="gap:10px">
        <label class="field"><span class="label">날짜</span><input id="f-date" type="date" /></label>
        <label class="field"><span class="label">메모</span><input id="f-memo" type="text" maxlength="60" placeholder="예: 화환도 보냄, 부부 같이 감" /></label>
      </div>
      <div class="row"><button class="btn primary" type="submit">저장</button></div>
    </form>
  </section>

  <section class="card" id="year-card">
    <div class="stat-row">
      <div class="stat"><span class="label" id="y-label">올해 내가 낸 돈</span><b id="s-give" class="give">0원</b></div>
      <div class="stat"><span class="label">올해 내가 받은 돈</span><b id="s-get" class="get">0원</b></div>
      <div class="stat"><span class="label">기록한 사람</span><b id="s-people">0명</b></div>
    </div>
  </section>

  <section class="card">
    <h2 id="people-title">사람별로 보기</h2>
    <ul class="list" id="people"></ul>
    <div id="people-pg"></div>
  </section>

  <section class="card">
    <h2 id="list-title">전체 기록</h2>
    <ul class="list" id="list"></ul>
    <div id="list-pg"></div>
  </section>
</main>

<script src="firebase.js?v=20261009q"></script>
<script src="sync.js?v=20261009q"></script>
<script src="life-config.js?v=20261009q"></script>
<script src="life.js?v=20261009q"></script>
<script src="shell.js?v=20261009q"></script>
<script src="import.js?v=20261009q"></script>
<script>
(function () {
  const { h, today, won, prettyDate, toast, sheet } = Life;
  const S = Life.store('gifts');
  const $ = id => document.getElementById(id);
  $('today').textContent = prettyDate(today());
  $('f-date').value = today();
  const RELS = ['가족', '친척', '친구', '회사', '지인', '기타'];
  const EVS = ['결혼', '장례', '돌잔치', '생일', '개업·집들이', '병문안', '기타'];
  let dir = 'give', rel = '친구', ev = '결혼', q = '';
  const parseAmt = v => parseInt(String(v).replace(/[^\d]/g, ''), 10) || 0;

  // 관계·무슨 일: 버튼으로 고르거나 "+ 직접 쓰기"로 적기
  const relC = Life.choice({ options: RELS, value: rel, onChange: v => { rel = v; }, extra: () => Life.usedValues(S.items(), 'rel', RELS), placeholder: '예: 처가, 동호회, 거래처' });
  const evC = Life.choice({ options: EVS, value: ev, onChange: v => { ev = v; }, extra: () => Life.usedValues(S.items(), 'ev', EVS), placeholder: '예: 칠순, 출산, 승진' });
  $('f-rel').replaceWith(relC.el); $('f-ev').replaceWith(evC.el);
  // 누가 누구에게 준 돈인지 문장으로 보여주기
  function say() {
    const n = $('f-name').value.trim() || '○○', a = parseAmt($('f-amt').value);
    const money = a ? won(a) : '돈';
    $('say').textContent = dir === 'give' ? '내가 ' + n + '님께 ' + money + '을 드렸어요' : n + '님이 나에게 ' + money + '을 줬어요';
    $('say').className = 'dir-say ' + dir;
  }
  $('f-name').addEventListener('input', say); $('f-amt').addEventListener('input', say);
  function setDir(d) { dir = d; $('d-give').setAttribute('aria-pressed', String(d === 'give')); $('d-get').setAttribute('aria-pressed', String(d === 'get')); say(); }
  say();
  $('d-give').onclick = () => setDir('give'); $('d-get').onclick = () => setDir('get');
  $('f-amt').addEventListener('input', e => { const n = parseAmt(e.target.value); e.target.value = n ? n.toLocaleString('ko-KR') : ''; });
  [50000, 100000, 200000].forEach(n => $('quick').append(h('button', { type: 'button', class: 'chip', onclick: () => { $('f-amt').value = n.toLocaleString('ko-KR'); } }, (n / 10000) + '만원')));
  // 이름을 고르면 지난번 관계를 따라감
  $('f-name').addEventListener('change', () => {
    const last = S.items().filter(x => x.person === $('f-name').value.trim()).sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
    if (last) { rel = last.rel; relC.set(rel); }
  });

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const person = $('f-name').value.trim(), amount = parseAmt($('f-amt').value);
    if (!person) { toast('누구인지 적어 주세요'); $('f-name').focus(); return; }
    if (!amount) { toast('금액을 넣어 주세요'); $('f-amt').focus(); return; }
    if (!rel) rel = '기타'; if (!ev) ev = '기타';
    S.put({ dir, person, rel, ev, amount, date: $('f-date').value || today(), memo: $('f-memo').value.trim() });
    toast(dir === 'give' ? '내가 ' + person + '님께 ' + won(amount) + ' 낸 걸 저장했어요' : person + '님께 ' + won(amount) + ' 받은 걸 저장했어요');
    $('f-name').value = ''; $('f-amt').value = ''; $('f-memo').value = '';
    relC.set(rel); evC.set(ev); say();
  });

  function edit(x) {
    const amt = h('input', { type: 'text', inputmode: 'numeric', class: 'amount-input', value: x.amount.toLocaleString('ko-KR') });
    amt.addEventListener('input', () => { const n = parseAmt(amt.value); amt.value = n ? n.toLocaleString('ko-KR') : ''; });
    const name = h('input', { type: 'text', maxlength: '20', value: x.person });
    const d = h('select', {}, [['give', '내가 냈어요 (내가 줌)'], ['get', '내가 받았어요 (상대가 줌)']].map(([v, l]) => h('option', { value: v, selected: v === x.dir }, l)));
    const evE = Life.choice({ options: EVS, value: x.ev, extra: () => Life.usedValues(S.items(), 'ev', EVS), placeholder: '예: 칠순, 출산' });
    const relE = Life.choice({ options: RELS, value: x.rel, extra: () => Life.usedValues(S.items(), 'rel', RELS), placeholder: '예: 처가, 거래처' });
    const date = h('input', { type: 'date', value: x.date });
    const memo = h('input', { type: 'text', maxlength: '60', value: x.memo || '' });
    let armed = false;
    const del = h('button', { class: 'btn ghost', type: 'button', onclick: () => {
      if (!armed) { armed = true; del.textContent = '한 번 더 누르면 삭제'; del.style.color = 'var(--danger)'; return; }
      S.remove(x.id); close(); toast('삭제했어요');
    } }, '삭제');
    const close = sheet('기록 고치기', h('div', { class: 'stack' },
      h('div', { class: 'grid2', style: 'gap:10px' }, h('label', { class: 'field' }, h('span', { class: 'label' }, '누구'), name), h('label', { class: 'field' }, h('span', { class: 'label' }, '누가 냈나요'), d)),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '금액'), amt),
      h('div', { class: 'field' }, h('span', { class: 'label' }, '무슨 일'), evE.el),
      h('div', { class: 'field' }, h('span', { class: 'label' }, '관계'), relE.el),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '날짜'), date),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '메모'), memo),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => {
        const a = parseAmt(amt.value); if (!a || !name.value.trim()) { toast('이름과 금액을 넣어 주세요'); return; }
        S.put(Object.assign({}, x, { person: name.value.trim(), dir: d.value, amount: a, ev: evE.get() || '기타', rel: relE.get() || '기타', date: date.value || x.date, memo: memo.value.trim() })); close(); toast('고쳤어요');
      } }, '저장'), h('span', { class: 'spacer' }), del)));
  }

  function row(x) {
    return h('li', { class: 'tx', tabindex: '0', role: 'button', onclick: () => edit(x), onkeydown: e => { if (e.key === 'Enter') edit(x); } },
      h('span', { class: 'badge ' + (x.dir === 'give' ? 'bad' : 'go') }, x.dir === 'give' ? '내가 냄' : '내가 받음'),
      h('div', { class: 'grow' }, h('div', { style: 'font-weight:650' }, hl(x.person), ' · ', hl(x.ev)), h('div', { class: 'tiny muted' }, prettyDate(x.date) + ' · ', hl(x.rel), x.memo ? [' · ', hl(x.memo)] : null)),
      h('span', { class: 'amt ' + x.dir }, won(x.amount)));
  }

  /* 탭: 기록하기 / 찾기 */
  let tab = 'rec', qDir = '', pgP = 1, pgL = 1;
  const P_SIZE = 10, L_SIZE = 20;
  function setTab(t) {
    tab = t; pgP = pgL = 1;
    [['rec', 'tab-rec'], ['find', 'tab-find']].forEach(([k, id]) => { $(id).setAttribute('aria-pressed', String(k === t)); $(id).setAttribute('aria-selected', String(k === t)); });
    $('rec-pane').hidden = t !== 'rec'; $('find-pane').hidden = t !== 'find'; $('year-card').hidden = t !== 'rec';
    if (t === 'find') setTimeout(() => $('q').focus(), 30);
    render();
  }
  $('tab-rec').onclick = () => setTab('rec'); $('tab-find').onclick = () => setTab('find');
  function drawQDir() { $('q-dir').replaceChildren(...[['', '전체'], ['give', '내가 낸 것만'], ['get', '내가 받은 것만']].map(([v, l]) => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(qDir === v), onclick: () => { qDir = v; pgP = pgL = 1; drawQDir(); render(); } }, l))); }
  drawQDir();
  $('q').addEventListener('input', e => { q = e.target.value.trim(); pgP = pgL = 1; render(); });

  /* 아무 말로 찾기: 이름·관계·무슨 일·메모·날짜·금액 */
  const lc = s => String(s || '').toLowerCase().replace(/\s+/g, '');
  function hay(x) {
    const [y, m, d] = (x.date || '').split('-').map(Number);
    const dates = x.date ? [x.date, y + '.' + m + '.' + d, y + '/' + m + '/' + d, m + '/' + d, m + '.' + d, y + '년' + m + '월' + d + '일', m + '월' + d + '일', y + '년'] : [];
    return lc([x.person, x.rel, x.ev, x.memo, x.dir === 'give' ? '내가냄 냄 낸돈 냈음' : '내가받음 받음 받은돈 받았음', ...dates, x.amount, (x.amount || 0).toLocaleString('ko-KR')].join('|'));
  }
  function matchTerm(x, t) {
    let m;
    if ((m = t.match(/^(\d{1,2})월$/))) return Number((x.date || '').slice(5, 7)) === Number(m[1]);
    if ((m = t.match(/^(\d{4})년?$/))) return (x.date || '').startsWith(m[1]) || String(x.amount).includes(m[1]);
    if ((m = t.match(/^([\d.]+)(만|천)원?$/))) return x.amount === Math.round(parseFloat(m[1]) * (m[2] === '만' ? 10000 : 1000));
    if ((m = t.match(/^(\d{4})[.\-\/](\d{1,2})$/))) return (x.date || '').startsWith(m[1] + '-' + m[2].padStart(2, '0'));
    if ((m = t.match(/^(\d{2,4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})\.?$/))) { const yy = m[1].length === 2 ? '20' + m[1] : m[1]; return x.date === yy + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0'); }
    return hay(x).includes(lc(t).replace(/,/g, '')) || hay(x).includes(lc(t));
  }
  const matches = x => (!qDir || x.dir === qDir) && (!q || q.split(/\s+/).filter(Boolean).every(t => matchTerm(x, t)));
  // 찾은 말에 형광펜
  function hl(text) {
    text = String(text || '');
    if (tab !== 'find' || !q) return text;
    const terms = q.split(/\s+/).filter(t => t && text.includes(t));
    if (!terms.length) return text;
    const t = terms.sort((a, b) => b.length - a.length)[0], i = text.indexOf(t);
    return [text.slice(0, i), h('mark', {}, t), text.slice(i + t.length)];
  }

  function render() {
    const all = S.items().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
    const y = today().slice(0, 4);
    $('y-label').textContent = y + '년 내가 낸 돈';
    $('s-give').textContent = won(all.filter(x => x.dir === 'give' && (x.date || '').startsWith(y)).reduce((s, x) => s + x.amount, 0));
    $('s-get').textContent = won(all.filter(x => x.dir === 'get' && (x.date || '').startsWith(y)).reduce((s, x) => s + x.amount, 0));
    const by = {};
    all.forEach(x => { const p = by[x.person] = by[x.person] || { give: 0, get: 0, rel: x.rel, last: x.date, n: 0 }; p[x.dir] += x.amount; p.n++; });
    $('s-people').textContent = Object.keys(by).length + '명';
    $('names').replaceChildren(...Object.keys(by).map(n => h('option', { value: n })));
    const finding = tab === 'find' && (q || qDir);
    const shown = finding ? all.filter(matches) : all;
    const fby = {};
    shown.forEach(x => { const p = fby[x.person] = fby[x.person] || { give: 0, get: 0, rel: x.rel, last: x.date, n: 0 }; p[x.dir] += x.amount; p.n++; });
    if (tab === 'find') {
      const g = shown.filter(x => x.dir === 'give').reduce((s, x) => s + x.amount, 0), t = shown.filter(x => x.dir === 'get').reduce((s, x) => s + x.amount, 0);
      $('q-sum').replaceChildren(
        h('div', { class: 'stat' }, h('span', { class: 'label' }, finding ? '찾은 기록' : '전체 기록'), h('b', {}, shown.length + '개')),
        h('div', { class: 'stat' }, h('span', { class: 'label' }, '그중 내가 낸 돈'), h('b', { class: 'give' }, won(g))),
        h('div', { class: 'stat' }, h('span', { class: 'label' }, '그중 내가 받은 돈'), h('b', { class: 'get' }, won(t))));
    }
    $('people-title').textContent = finding ? '찾은 사람 ' + Object.keys(fby).length + '명' : '사람별로 보기';
    $('list-title').textContent = finding ? '찾은 기록 ' + shown.length + '개' : '전체 기록';
    const people = Object.entries(fby).sort((a, b) => (b[1].last || '').localeCompare(a[1].last || ''));
    pgP = Math.min(pgP, Math.max(1, Math.ceil(people.length / P_SIZE)));
    pgL = Math.min(pgL, Math.max(1, Math.ceil(shown.length / L_SIZE)));
    $('people').replaceChildren(...(people.length ? people.slice((pgP - 1) * P_SIZE, pgP * P_SIZE).map(([n, p]) => h('li', {},
      h('div', { class: 'grow person' },
        h('div', { class: 'row' }, h('b', {}, hl(n)), h('span', { class: 'badge' }, hl(p.rel)), h('span', { class: 'tiny muted' }, p.n + '번 · 마지막 ' + prettyDate(p.last))),
        h('div', { class: 'flow' }, h('span', { class: 'give' }, '내가 낸 돈 ' + won(p.give)), h('span', { class: 'get' }, '내가 받은 돈 ' + won(p.get)))),
      h('button', { class: 'btn sm soft', type: 'button', onclick: () => { setTab('rec'); $('f-name').value = n; rel = p.rel; relC.set(rel); say(); window.scrollTo({ top: 0, behavior: 'smooth' }); $('f-amt').focus(); } }, '이 사람 기록')))
      : [h('li', { class: 'empty' }, finding ? '찾는 기록이 없어요. 다른 말로 찾아보세요.' : '위에서 처음 기록하면 사람별로 모여요.')]));
    $('list').replaceChildren(...(shown.length ? shown.slice((pgL - 1) * L_SIZE, pgL * L_SIZE).map(row) : [h('li', { class: 'empty' }, finding ? '찾는 기록이 없어요.' : '아직 기록이 없어요.')]));
    $('people-pg').replaceChildren(Life.pager(people.length, P_SIZE, pgP, n => { pgP = n; render(); $('people-title').scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
    $('list-pg').replaceChildren(Life.pager(shown.length, L_SIZE, pgL, n => { pgL = n; render(); $('list-title').scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
  }

  // 엑셀로 넣기·받기
  Life.excel({ store: S, title: '경조사 장부',
    fields: [
      { key: 'date', label: '날짜', type: 'date', aliases: ['일자', '언제', '날'] },
      { key: 'person', label: '이름', type: 'text', required: true, aliases: ['누구', '성함', '보낸사람', '받은사람', '상대', '대상'] },
      { key: 'dir', label: '구분', type: 'choice', aliases: ['냄받음', '주고받음', '종류', '내역구분', '입출'], options: [['give', '내가냄', '내가 냈음', '냈음', '냄', '낸', '보냄', '보낸', '지출', '출금', '나감', '드림', '줌', '준'], ['get', '내가받음', '내가 받았음', '받음', '받은', '받았', '입금', '들어옴', '수입']], out: x => x.dir === 'get' ? '내가 받음' : '내가 냄', fixedOptions: ['내가 냄', '내가 받음'] },
      { key: 'amount', label: '금액', type: 'amount', aliases: ['액수', '돈', '축의금', '부의금', '봉투'], out: x => x.amount },
      { key: 'give', label: '낸 돈', type: 'amount', aliases: ['낸금액', '보낸돈', '보낸금액', '지출', '나간돈'], noExport: true },
      { key: 'get', label: '받은 돈', type: 'amount', aliases: ['받은금액', '들어온돈', '수입'], noExport: true },
      { key: 'ev', label: '무슨 일', type: 'choice', aliases: ['행사', '경조사', '내용', '종류', '이유', '사유'], options: [['결혼', '결혼식', '웨딩', '축의'], ['장례', '장례식', '부고', '조문', '조의', '부의', '상'], ['돌잔치', '돌', '백일'], ['생일', '생신'], ['개업·집들이', '개업', '집들이', '이사'], ['병문안', '병원', '입원'], ['기타']], keepRaw: true },
      { key: 'rel', label: '관계', type: 'choice', aliases: ['사이', '구분2'], options: [['가족'], ['친척'], ['친구'], ['회사', '직장', '회사동료', '직장동료'], ['지인'], ['기타']], keepRaw: true },
      { key: 'memo', label: '메모', type: 'text', aliases: ['비고', '참고', '설명'] }
    ],
    toItem(v) {
      let amount = v.amount, dir = v.dir;
      if (!amount && v.give) { amount = v.give; dir = 'give'; }
      if (!amount && v.get) { amount = v.get; dir = 'get'; }
      if (!v.person) return { error: '이름이 없어요' };
      if (!amount) return { error: '금액이 없어요' };
      if (amount < 0) { amount = -amount; dir = dir || 'give'; }
      return { person: v.person, dir: dir || 'give', amount, ev: v.ev || '기타', rel: v.rel || '기타', date: v.date || today(), memo: v.memo || '' };
    },
    dupKey: x => [x.person, x.dir, x.amount, x.date].join('|'),
    preview: [['날짜', x => x.date], ['이름', x => x.person], ['구분', x => x.dir === 'get' ? '내가 받음' : '내가 냄'], ['금액', x => x.amount.toLocaleString('ko-KR') + '원'], ['무슨 일', x => x.ev], ['관계', x => x.rel]],
    exportSort: (a, b) => (a.date || '').localeCompare(b.date || ''),
    sample: [['2024-05-18', '김민수', '내가 냄', '100000', '결혼', '친구', '부부 같이 감'], ['2024-09-02', '박지영', '내가 받음', '50000', '돌잔치', '회사', '']],
    note: '"낸 돈", "받은 돈"이 따로 열로 나뉘어 있어도 괜찮아요. 날짜가 없으면 오늘 날짜로, 무슨 일이 없으면 "기타"로 넣어요.'
  });
  S.subscribe(render);
  render();
})();
</script>
</body>
</html>
