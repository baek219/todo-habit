<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>할일습관 바탕화면 달력</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, "Segoe UI", sans-serif; }
  body { --fs: 13px; --glass: 20,28,25; --alpha: 0.45; --text: #F3F7F5; --muted: rgba(243,247,245,0.62); --line: rgba(255,255,255,0.14);
    --accent: #4CA98A; --sun: #FF7A7A; --sat: #8FB8FF; --cell-hover: rgba(255,255,255,0.08); }
  body.light { --glass: 255,255,255; --text: #1F2A25; --muted: rgba(31,42,37,0.6); --line: rgba(0,0,0,0.1); --sun: #D64545; --sat: #2F64B5; --cell-hover: rgba(0,0,0,0.05); }
  .wrap { position: absolute; inset: 0; border-radius: 12px; background: rgba(var(--glass), var(--alpha)); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden; font-size: var(--fs); }
  .bar { display: flex; align-items: center; gap: 4px; padding: 8px 10px; flex: none; }
  body.unlocked .bar { -webkit-app-region: drag; cursor: move; }
  .bar button, .bar .no-drag { -webkit-app-region: no-drag; }
  .bar .title { flex: 1; text-align: center; font-weight: 700; font-size: calc(var(--fs) * 1.1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { border: none; background: transparent; color: var(--text); font-size: calc(var(--fs) * 1.15); width: 30px; height: 28px; border-radius: 8px; cursor: pointer; opacity: 0.85; }
  .ib:hover { background: var(--cell-hover); opacity: 1; }
  .ib.on { color: var(--accent); opacity: 1; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); flex: none; border-top: 1px solid var(--line); }
  .dow div { text-align: center; padding: 6px 0; font-weight: 700; font-size: calc(var(--fs) * 0.95); }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; min-height: 0; }
  .cell { border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 4px 5px; overflow: hidden; cursor: pointer; position: relative; min-height: 0; }
  .cell:nth-child(7n+1) { border-left: none; }
  .cell:hover { background: var(--cell-hover); }
  .cell.other { opacity: 0.42; }
  .cell.imp { background: rgba(255,200,61,0.16); }
  body.light .cell.imp { background: rgba(242,182,0,0.16); }
  .cell.imp .dnum .n { color: #FFC83D; }
  body.light .cell.imp .dnum .n { color: #C88400; }
  .it.imp .lb { font-weight: 900; }
  .impb { display:inline-block; font-size: 0.8em; font-weight: 800; color: #fff; background: #E6A100; border-radius: 5px; padding: 0 5px; margin-right: 4px; }
  .imp-tg { border: 1px solid var(--line); background: rgba(127,127,127,0.12); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 700; font-family: inherit; }
  .imp-tg.on { background: #E6A100; border-color: #E6A100; color: #fff; }
  .cell.today { box-shadow: inset 0 0 0 2px var(--accent); background: rgba(255,255,255,0.06); border-radius: 4px; }
  .dnum { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dnum .lunar { font-weight: 600; color: var(--muted); margin-left: 3px; font-size: calc(var(--fs) * 0.9); }
  .dnum .hol { color: var(--sun); margin-left: 3px; font-size: calc(var(--fs) * 0.9); }
  .dnum .mood { margin-left: 2px; }
  .sun .dnum .n, .hol-day .dnum .n { color: var(--sun); }
  .sat .dnum .n { color: var(--sat); }
  .it { font-size: calc(var(--fs) * 0.88); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .it.done { opacity: 0.55; }
  .it .sym { font-weight: 900; margin-right: 2px; }
  .it.rng { margin: 1px -5px 0 -5px; padding: 0 5px; font-weight: 700; border-radius: 0; }
  .it.done .lb { text-decoration: line-through; }
  .legend { display: flex; gap: 8px; font-size: calc(var(--fs) * 0.82); white-space: nowrap; margin-right: 6px; }
  .legend b { font-weight: 900; margin-right: 1px; }
  @media (max-width: 720px) { .legend { display: none; } }
  .types { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 12px; }
  .types button { border: 1.5px solid var(--line); background: transparent; color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: calc(var(--fs) * 0.92); font-weight: 700; }
  .types button.on { color: #fff; }
  .memo-body { width: 100%; margin-top: 6px; border: 1px solid var(--line); background: rgba(127,127,127,0.12); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: var(--fs); outline: none; font-family: inherit; resize: vertical; min-height: 70px; user-select: text; }
  .row .mb { color: var(--muted); font-size: calc(var(--fs) * 0.88); white-space: pre-line; margin-top: 4px; display: none; }
  .row.open .mb { display: block; }
  .more { font-size: calc(var(--fs) * 0.8); color: var(--muted); }
  .grip { position: absolute; right: 2px; bottom: 2px; width: 18px; height: 18px; cursor: nwse-resize; display: none; opacity: 0.7;
    background: linear-gradient(135deg, transparent 50%, var(--muted) 50%, var(--muted) 60%, transparent 60%, transparent 70%, var(--muted) 70%, var(--muted) 80%, transparent 80%); }
  body.unlocked .grip { display: block; }
  body.unlocked .wrap { outline: 2px dashed var(--accent); outline-offset: -2px; }
  /* 날짜 눌렀을 때 / 설정 창 */
  .panel { position: absolute; inset: 10px; background: rgba(var(--glass), 0.96); border-radius: 12px; padding: 14px; overflow-y: auto; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35); color: var(--text); z-index: 5; }
  body:not(.light) .panel { background: rgba(28,36,33,0.97); }
  .panel.show { display: block; }
  .panel h3 { margin: 0 0 10px; font-size: calc(var(--fs) * 1.25); }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .box { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; }
  .box.on { background: var(--accent); border-color: var(--accent); }
  .edit-b { flex: none; border: 1px solid var(--line); background: rgba(127,127,127,0.12); color: var(--text); border-radius: 7px; padding: 3px 9px; cursor: pointer; font-family: inherit; font-size: calc(var(--fs) * 0.95); }
  .edit-b:hover { background: var(--accent); color: #fff; }
  .ef label { display: block; font-size: calc(var(--fs) * 0.85); color: var(--muted); margin: 10px 0 4px; font-weight: 700; }
  .ef input, .ef select, .ef textarea { font-family: inherit; font-size: var(--fs); background: rgba(127,127,127,0.12); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .ef .full { width: 100%; }
  .ef textarea { width: 100%; min-height: 70px; resize: vertical; }
  .ef .r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ef .days button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 7px; padding: 4px 8px; cursor: pointer; font-family: inherit; }
  .ef .days button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row .sub { color: var(--muted); font-size: calc(var(--fs) * 0.85); margin-left: auto; white-space: nowrap; }
  .addrow { display: flex; gap: 6px; margin-top: 12px; }
  .addrow input { flex: 1; border: 1px solid var(--line); background: rgba(127,127,127,0.12); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: var(--fs); outline: none; font-family: inherit; user-select: text; }
  .btn { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; font-size: var(--fs); font-family: inherit; }
  .btn.gray { background: rgba(127,127,127,0.25); color: var(--text); }
  .set { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .set input[type=range] { width: 160px; accent-color: var(--accent); }
  .seg { display: flex; gap: 4px; }
  .seg button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 7px; padding: 5px 9px; cursor: pointer; font-family: inherit; font-size: calc(var(--fs) * 0.9); }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tg { width: 40px; height: 22px; border-radius: 12px; border: none; background: rgba(127,127,127,0.4); position: relative; cursor: pointer; flex: none; }
  .tg::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .tg.on { background: var(--accent); }
  .tg.on::after { left: 20px; }
  .note { color: var(--muted); font-size: calc(var(--fs) * 0.85); line-height: 1.5; margin-top: 8px; }
  .cloud { font-size: calc(var(--fs) * 0.85); color: var(--muted); white-space: nowrap; }
</style>
</head>
<body class="">
<div class="wrap" id="wrap">
  <div class="bar">
    <button class="ib" id="b-prev" title="이전 달">‹</button>
    <button class="ib" id="b-today" title="이번 달로">●</button>
    <button class="ib" id="b-next" title="다음 달">›</button>

</div>
<div class="panel" id="day-panel"></div>
<div class="panel" id="set-panel"></div>
<script src="firebase.js"></script>
<script src="sync.js"></script>
<script src="lunar.js"></script>
<script src="repeat.js"></script>
<script src="quick.js"></script>
<script>
(function () {
  const DB = window.DesktopBridge || null; // PC 프로그램 안에서 열렸을 때만 있음
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const KEY_TASKS = 'todo_habit_tasks_v3', KEY_LOGS = 'day_logs_v1', KEY_SET = 'app_settings_v1', KEY_NOTES = 'notes_v1', DESK_KEY = 'desk_settings_v1';
  let tasks = [], dayLogs = {}, appSettings = {}, notes = [];
  let desk = { alpha: 45, style: 'dark', font: 'mid', lunar: true, daily: false, weekly: true, monthly: true, todo: true, memo: true, mood: true, locked: true, onTop: false, autoStart: true };
  // 종류별 기호·색 (폰 앱·위젯과 같아요)
  const SYM = { daily: '●', weekly: '■', monthly: '▲', todo: '◆', memo: '✎', shift: '◎' };
  const COL_DARK = { daily: '#56B4E9', weekly: '#F0A830', monthly: '#2BC79A', todo: '#E7A3C7', memo: '#FF8A50', shift: '#9EA3FF' };
  const COL_LIGHT = { daily: '#0072B2', weekly: '#C88400', monthly: '#009E73', todo: '#B8558F', memo: '#D55E00', shift: '#5B5FC7' };
  const NAME = { daily: '매일', weekly: '매주', monthly: '매달', todo: '할일', memo: '메모', shift: '교대' };
  function shortTime(hhmm) { if (!hhmm) return ''; const [h, m] = hhmm.split(':'); return parseInt(h, 10) + ':' + m; }
  function shifts() { return Array.isArray(appSettings.shifts) ? appSettings.shifts : []; }
  function col(k) { return (desk.style === 'light' ? COL_LIGHT : COL_DARK)[k]; }
  // 기간 (시작일 ~ 끝나는 날)
  function inRange(start, end, ds) { return !!start && start <= ds && ds <= (end && end > start ? end : start); }
  // 반복(매주·매달·매년, 양력·음력) 포함: 그날 걸리는 회차 시작일
  const RP = window.Repeat;
  function isRep(x) { return !!(RP && RP.isRepeat(x.repeat)); }
  function occOf(start, end, x, ds) { return isRep(x) ? RP.occStartOn(start, end, x.repeat, !!x.lunar, ds) : (inRange(start, end, ds) ? start : null); }
  function spanOf(start, end) { return RP ? RP.span(start, end) : 0; }
  function addD(ds, n) { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); }
  function todoDone(t, ds) { if (!isRep(t)) return !!t.done; const o = occOf(t.dueDate, t.endDate, t, ds); return !!o && (t.doneDates || []).includes(o); }
  function md(ds) { return parseInt(ds.slice(5, 7), 10) + '/' + parseInt(ds.slice(8, 10), 10); }
  function rangeLabel(a, b) { return b && b > a ? md(a) + '~' + md(b) : md(a); }
  const now0 = new Date();
  let viewY = now0.getFullYear(), viewM = now0.getMonth();

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function load() {
    try { tasks = JSON.parse(localStorage.getItem(KEY_TASKS) || '[]') || []; } catch (e) { tasks = []; }
    try { dayLogs = JSON.parse(localStorage.getItem(KEY_LOGS) || '{}') || {}; } catch (e) { dayLogs = {}; }
    try { appSettings = JSON.parse(localStorage.getItem(KEY_SET) || '{}') || {}; } catch (e) { appSettings = {}; }
    try { notes = JSON.parse(localStorage.getItem(KEY_NOTES) || '[]') || []; } catch (e) { notes = []; }
    try { desk = Object.assign(desk, JSON.parse(localStorage.getItem(DESK_KEY) || '{}') || {}); } catch (e) {}
  }
  function saveTasks() {
    try { localStorage.setItem(KEY_TASKS, JSON.stringify(tasks)); } catch (e) {}
    if (window.CloudSync) window.CloudSync.schedulePush();
  }
  function saveNotes() {
    try { localStorage.setItem(KEY_NOTES, JSON.stringify(notes)); } catch (e) {}
    if (window.CloudSync) window.CloudSync.schedulePush();
  }
  function saveDesk() { try { localStorage.setItem(DESK_KEY, JSON.stringify(desk)); } catch (e) {} }

  // ---- 습관 판정 (앱과 같은 규칙) ----
  function dim(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function isPaused(h, ds) { return (h.pauses || []).some(p => p.start <= ds && ds <= p.end); }
  function scheduled(h, d) {
    const ds = iso(d);
    if (isPaused(h, ds)) return false;
    if (h.startDate && ds < h.startDate) return false; // 시작일 전에는 안 보임
    if (h.frequency === 'daily') return true;
    if (h.frequency === 'monthly') return d.getDate() === Math.min(h.monthDay || 1, dim(d.getFullYear(), d.getMonth()));
    return (h.repeatDays || [0, 1, 2, 3, 4, 5, 6]).includes(d.getDay());
  }
  function target(h) { return Math.max(1, parseInt(h.target, 10) || 1); }
  function count(h, ds) { return target(h) === 1 ? ((h.completedDates || []).includes(ds) ? 1 : 0) : ((h.counts || {})[ds] || 0); }
  function setCount(h, ds, n) {
    const t = target(h); n = Math.max(0, Math.min(99, n));
    if (t > 1) { h.counts = h.counts || {}; if (n > 0) h.counts[ds] = n; else delete h.counts[ds]; }
    h.completedDates = (h.completedDates || []).filter(x => x !== ds);
    if (n >= t) h.completedDates.push(ds);
  }
  function itemsFor(d) {
    const ds = iso(d), out = [];
    tasks.forEach(t => {
      if (t.type === 'todo') {
        const o = desk.todo ? occOf(t.dueDate, t.endDate, t, ds) : null;
        if (o) out.push({ t, kind: 'todo', type: 'todo', done: todoDone(t, ds), label: t.title, time: t.time || '', rs: o, re: addD(o, spanOf(t.dueDate, t.endDate)) });
        return;
      }
      if (t.type !== 'habit') return;
      const f = t.frequency;
      if ((f === 'daily' && !desk.daily) || (f === 'weekly' && !desk.weekly) || (f === 'monthly' && !desk.monthly)) return;
      if (!scheduled(t, d)) return;
      const tg = target(t), c = count(t, ds);
      out.push({ t, kind: 'habit', type: f, done: (t.completedDates || []).includes(ds), label: t.title + (tg > 1 ? ` ${c}/${tg}` : '') });
    });
    if (desk.memo) notes.forEach(n => { const o = occOf(n.date, n.endDate, n, ds); if (o) out.push({ n, kind: 'memo', type: 'memo', done: false, label: n.title || (n.body || '').split('\n')[0] || '메모', rs: o, re: addD(o, spanOf(n.date, n.endDate)) }); });
    // 교대근무
    if (RP && RP.shiftItem) shifts().forEach(sh => { const it = RP.shiftItem(sh, ds); if (it) out.push({ t: { id: 'shift_' + sh.id, title: it.label }, kind: 'shift', type: 'shift', done: false, label: it.label, rs: it.s, re: it.e }); });
    const order = { shift: -1, todo: 0, daily: 1, weekly: 2, monthly: 3, memo: 4 };
    const isR = x => !!(x.rs && x.re && x.re > x.rs);
    out.forEach(x => { x.imp = !!((x.t || x.n || {}).important); x.time = x.time || ''; });
    out.sort((a, b) => (isR(b) - isR(a)) || ((b.imp ? 1 : 0) - (a.imp ? 1 : 0)) || ((a.time ? 0 : 1) - (b.time ? 0 : 1)) || (a.time < b.time ? -1 : a.time > b.time ? 1 : 0) || (order[a.type] - order[b.type]));
    return out;
  }
  const lunarCal = window.KoreanLunarCalendar ? new window.KoreanLunarCalendar() : null;
  function lunarText(d) {
    if (!lunarCal) return '';
    try {
      lunarCal.setSolarDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
      const l = lunarCal.getLunarCalendar();
      return '(음)' + (l.intercalation ? '윤' : '') + l.month + '.' + l.day;
    } catch (e) { return ''; }
  }
  const HOLIDAYS = {
    '2026-01-01': '신정', '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴',
    '2026-03-01': '삼일절', '2026-03-02': '삼일절 대체공휴일', '2026-05-01': '노동절', '2026-05-05': '어린이날',
    '2026-05-24': '부처님오신날', '2026-05-25': '부처님오신날 대체공휴일', '2026-06-06': '현충일',
    '2026-07-17': '제헌절', '2026-08-15': '광복절', '2026-08-17': '광복절 대체공휴일',
    '2026-09-24': '추석 연휴', '2026-09-25': '추석', '2026-09-26': '추석 연휴',
    '2026-10-03': '개천절', '2026-10-05': '개천절 대체공휴일', '2026-10-09': '한글날', '2026-12-25': '크리스마스',
    '2027-01-01': '신정', '2027-02-06': '설날 연휴', '2027-02-07': '설날', '2027-02-08': '설날 연휴', '2027-02-09': '설날 대체공휴일',
    '2027-03-01': '삼일절', '2027-05-01': '노동절', '2027-05-03': '노동절 대체공휴일', '2027-05-05': '어린이날',
    '2027-05-13': '부처님오신날', '2027-06-06': '현충일', '2027-07-17': '제헌절', '2027-07-19': '제헌절 대체공휴일',
    '2027-08-15': '광복절', '2027-08-16': '광복절 대체공휴일', '2027-09-14': '추석 연휴', '2027-09-15': '추석', '2027-09-16': '추석 연휴',
    '2027-10-03': '개천절', '2027-10-04': '개천절 대체공휴일', '2027-10-09': '한글날', '2027-10-11': '한글날 대체공휴일',
    '2027-12-25': '크리스마스', '2027-12-27': '크리스마스 대체공휴일'
  };  const THEMES = [
    { key: 'forest',   name: '숲',     l: ['#2F6F5E', '#23574A', '#DCEAE4', '#EFF4F1'], d: ['#4CA98A', '#3A8A70', '#24352D', '#17201C', '#1F2B25', '#8CEFCB'] },

  function applyLook() {

  // 한 주 안의 기간 띠 줄 자리 정하기 (칸이 바뀌어도 같은 높이로 이어지게)
  function weekLanes(itemsList) {
    const isR = x => !!(x.rs && x.re && x.re > x.rs);
    const keyOf = x => (x.n ? 'n' + x.n.id : 't' + x.t.id) + '@' + x.rs;
    const ranges = {};
    itemsList.forEach((items, k) => items.forEach(x => {
      if (!isR(x)) return;
      const key = keyOf(x);
      if (!ranges[key]) ranges[key] = { key, from: k, to: k, rs: x.rs, re: x.re }; else ranges[key].to = k;
    }));
    const list = Object.values(ranges).sort((a, b) => (a.rs < b.rs ? -1 : a.rs > b.rs ? 1 : 0) || (b.re > a.re ? 1 : b.re < a.re ? -1 : 0) || (a.key < b.key ? -1 : 1));
    const laneEnd = [];
    list.forEach(r => { let L = 0; while (L < laneEnd.length && laneEnd[L] >= r.from) L++; laneEnd[L] = r.to; r.lane = L; });
    return itemsList.map(items => {
      const slots = [];
      items.forEach(x => { if (isR(x)) slots[ranges[keyOf(x)].lane] = x; });
      const out = [];
      for (let i = 0; i < slots.length; i++) out.push(slots[i] || { blank: true });
      items.forEach(x => { if (!isR(x)) out.push(x); });
      return out;
    });
  }
  // ⭐ 다가오는 중요한 날 (제목줄에 'D-11')
  function ddayText() {
    const tds = iso(new Date()); let best = null;
    const consider = (title, o) => { if (!o) return; const dn = Math.round((new Date(o + 'T00:00:00') - new Date(tds + 'T00:00:00')) / 86400000); if (dn > 400) return; if (!best || dn < best.dn) best = { title, dn }; };
    tasks.forEach(t => { if (t.type !== 'todo' || !t.important || !t.dueDate) return;
      const o = isRep(t) ? RP.nextOcc(t.dueDate, t.endDate, t.repeat, !!t.lunar, tds) : ((t.endDate || t.dueDate) >= tds && !t.done ? t.dueDate : null);
      if (o && isRep(t) && (t.doneDates || []).includes(o)) return; consider(t.title, o); });
    notes.forEach(n => { if (!n.important || !n.date) return;
      consider(n.title || '메모', isRep(n) ? RP.nextOcc(n.date, n.endDate, n.repeat, !!n.lunar, tds) : ((n.endDate || n.date) >= tds ? n.date : null)); });
    return best ? `  ·  ⭐ ${best.title} ${best.dn === 0 ? 'D-DAY' : best.dn < 0 ? '진행 중' : 'D-' + best.dn}` : '';
  }

    for (let i = 0; i < weeks * 7; i++) {

          }

          return `<div class="it ${it.done ? 'done' : ''} ${it.imp ? 'imp' : ''}"><span class="sym" style="color:${it.imp ? '#E6A100' : col(it.type)}">${it.done ? '✓' : it.imp ? '★' : SYM[it.type]}</span><span class="lb">${it.time ? `<b style="opacity:.75">${shortTime(it.time)}</b> ` : ''}${esc(it.label)}${rp ? ' <small style="opacity:.6">🔁</small>' : ''}</span></div>`;
        }).join('')}
      </div>`;
    }
    grid.innerHTML = html;
    grid.querySelectorAll('.cell').forEach(c => c.addEventListener('click', () => openDay(c.getAttribute('data-date'))));
    // 칸에 다 안 들어가는 항목은 '+N개'로
    grid.querySelectorAll('.cell').forEach(c => {
      const its = [...c.querySelectorAll('.it')];
      if (!its.length) return;
      const limit = c.clientHeight;
      let hidden = 0;
      const real = el => !el.classList.contains('blank');
      for (let k = its.length - 1; k >= 0; k--) {
        if (its[k].offsetTop + its[k].offsetHeight <= limit - 2) break;
        if (real(its[k])) hidden++; its[k].remove();
      }
      if (hidden) {
        const rest = c.querySelectorAll('.it');
        const last = rest[rest.length - 1];
        if (last) { if (real(last)) hidden++; last.remove(); }
        const m = document.createElement('div'); m.className = 'more'; m.textContent = `+${hidden}개 더`;
        c.appendChild(m);

    document.getElementById('legend').innerHTML = ['daily', 'weekly', 'monthly', 'todo', 'memo'].concat(shifts().length ? ['shift'] : []).map(k => `<span><b style="color:${col(k)}">${SYM[k]}</b>${NAME[k]}</span>`).join('');
    renderCloud();
  }

  // ---- 날짜 누르면: 그날 목록 체크 + 할일 추가 ----

  function openDay(ds) {

      tasks.forEach(t => {
        if (t.type === 'todo') { const o = occOf(t.dueDate, t.endDate, t, ds); if (o) all.push({ t, kind: 'todo', type: 'todo', occ: o }); }
        else if (t.type === 'habit' && scheduled(t, d)) all.push({ t, kind: 'habit', type: t.frequency });
      });
      notes.forEach(n => { const o = occOf(n.date, n.endDate, n, ds); if (o) all.push({ n, kind: 'memo', type: 'memo', occ: o }); });
      if (RP && RP.shiftItem) shifts().forEach(sh => { const it = RP.shiftItem(sh, ds); if (it) all.push({ kind: 'shift', type: 'shift', label: it.label, s: it.s, e: it.e, code: RP.shiftCode(sh, ds) }); });
      const order = { shift: -1, todo: 0, daily: 1, weekly: 2, monthly: 3, memo: 4 };
      const tm = x => (x.kind === 'todo' && x.t.time) || '~';
      all.sort((a, b) => (order[a.type] - order[b.type]) || (tm(a) < tm(b) ? -1 : tm(a) > tm(b) ? 1 : 0));
      const log = dayLogs[ds];
      p.innerHTML = `<h3>${d.getMonth() + 1}월 ${md}일 ${wd}요일 <small style="font-weight:500; color:var(--muted)">${lunarText(d)} ${HOLIDAYS[ds] ? '· ' + esc(HOLIDAYS[ds]) : ''}</small></h3>
        ${log && (log.mood || log.note) ? `<div class="note" style="margin:0 0 8px;">${log.mood || ''} ${esc(log.note || '')}</div>` : ''}
        ${all.length ? all.map((x, i) => {
          if (x.kind === 'shift') return `<div class="row"><span class="sym" style="color:${col('shift')}; font-weight:900; width:20px; text-align:center;">◎</span><div style="flex:1;">${esc(x.label)} <small style="color:var(--muted)">${x.e > x.s ? rangeLabel(x.s, x.e) + ' · ' : ''}${RP.SHIFT_NAMES[x.code] || ''}</small></div><div class="sub" style="color:${col('shift')}">교대 (폰 설정에서 바꿔요)</div></div>`;
          if (x.kind === 'memo') {
            const n = x.n;
            return `<div class="row" data-memo="${i}" style="flex-wrap:wrap;"><span class="sym" style="color:${col('memo')}; font-weight:900; width:20px; text-align:center;">✎</span><div style="flex:1; min-width:0;"><div>${n.important ? '<span class="impb">⭐</span>' : ''}${esc(n.title || (n.body || '').split('\n')[0] || '메모')}${spanOf(n.date, n.endDate) ? ` <small style="color:${col('memo')}">↔ ${rangeLabel(x.occ, addD(x.occ, spanOf(n.date, n.endDate)))}</small>` : ''}${isRep(n) ? ` <small style="color:var(--muted)">🔁 ${RP.describe(n.date, n.repeat, !!n.lunar)}</small>` : ''}</div><div class="mb">${esc(n.body || '')}</div></div><div class="sub" style="color:${col('memo')}">메모 ▾</div><button class="edit-b" data-edit-n="${n.id}" title="수정·삭제">✎</button></div>`;
          }
          const t = x.t, tg = x.kind === 'habit' ? target(t) : 1, c = x.kind === 'habit' ? count(t, ds) : 0;
          const done = x.kind === 'todo' ? todoDone(t, ds) : (t.completedDates || []).includes(ds);
          const sub = `<span style="color:${col(x.type)}">${SYM[x.type]} ${NAME[x.type]}</span>` + (tg > 1 ? ` · ${c}/${tg}` : '');
          const rg = (x.kind === 'todo' && spanOf(t.dueDate, t.endDate) ? ` <small style="color:${col('todo')}">↔ ${rangeLabel(x.occ, addD(x.occ, spanOf(t.dueDate, t.endDate)))}</small>` : '') +
            (x.kind === 'todo' && isRep(t) ? ` <small style="color:var(--muted)">🔁 ${RP.describe(t.dueDate, t.repeat, !!t.lunar)}</small>` : '');
          return `<div class="row" data-i="${i}"><div class="box ${done ? 'on' : ''}" style="${done ? `background:${col(x.type)}; border-color:${col(x.type)}` : `border-color:${col(x.type)}`}">${done ? '✓' : ''}</div><div>${t.important ? '<span class="impb">⭐</span>' : ''}${x.kind === 'todo' && t.time ? `<b>${shortTime(t.time)}</b> ` : ''}${esc(t.title)}${rg}</div><div class="sub">${sub}</div><button class="edit-b" data-edit-t="${t.id}" title="수정·삭제">✎</button></div>`;
        }).join('') + '<div class="note" style="margin-top:6px;">👆 줄을 누르면 체크 · <b>✎</b>를 누르면 수정·삭제</div>' : '<div class="note">이 날은 예정된 게 없어요.</div>'}
        <div class="types" id="types">${['todo', 'daily', 'weekly', 'monthly', 'memo'].map(k => `<button data-type="${k}" style="${addType === k ? `background:${col(k)}; border-color:${col(k)}` : `border-color:${col(k)}; color:${col(k)}`}" class="${addType === k ? 'on' : ''}">${SYM[k]} ${NAME[k] === '할일' || NAME[k] === '메모' ? NAME[k] : NAME[k] + ' 습관'}</button>`).join('')}</div>
        <div class="note" style="margin-top:6px;">${HINT[addType]}</div>
        <div class="addrow" style="margin-top:6px;"><input id="add-input" placeholder="${addType === 'memo' ? '메모 제목' : '이름 (예: ' + ({ todo: '우유 사기', daily: '물 마시기', weekly: '헬스장 가기', monthly: '공과금 내기' })[addType] + ')'}" maxlength="60" /><button class="btn" id="add-btn" style="background:${col(addType)}">추가</button></div>
        ${addType === 'todo' || addType === 'memo' ? `<div class="addrow" style="margin-top:6px; align-items:center;"><span class="note" style="margin:0;">시작 <b>${+ds.slice(5,7)}/${+ds.slice(8,10)}</b> → 끝</span><input type="date" id="add-end" min="${ds}" style="flex:none; width:auto;" /><span class="note" style="margin:0; opacity:.7;">(여러 날일 때만)</span></div>
          <div class="addrow" style="margin-top:6px; align-items:center;"><span class="note" style="margin:0;">🔁 반복:</span>
            <select id="add-rep" style="flex:none; width:auto; background:rgba(127,127,127,0.12); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px;">
              <option value="none">안 함</option><option value="weekly">매주 ${wd}요일</option><option value="monthly">매달 ${md}일</option><option value="monthEnd">매달 말일</option><option value="yearly">매년 ${d.getMonth() + 1}월 ${md}일 (생일·기념일)</option></select>
            <select id="add-lunar" style="flex:none; width:auto; background:rgba(127,127,127,0.12); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px;">
              <option value="0">☀️ 양력</option><option value="1">🌙 음력 (${lunarText(d).replace('(음)', '')})</option></select>
</div>
          <div class="note" id="add-rep-desc" style="margin:4px 0 0; font-weight:700;"></div>` : ''}
        ${addType === 'todo' ? `<div class="addrow" style="margin-top:6px; align-items:center;"><span class="note" style="margin:0;">🕘 시간 (선택):</span><input type="time" id="add-time" style="flex:none; width:auto;" /><span class="note" style="margin:0; opacity:.7;">폰에서 그 시간에 알림이 와요</span></div>` : ''}
        ${addType === 'todo' || addType === 'memo' ? `<div class="addrow" style="margin-top:6px; align-items:center;"><button class="imp-tg ${addImp ? 'on' : ''}" id="add-imp">${addImp ? '⭐ 중요한 날 (켜짐)' : '☆ 중요한 날로 강조'}</button><span class="note" style="margin:0;">달력에 노란색 ★로 눈에 띄게 보여요</span></div>` : ''}
        ${addType === 'memo' ? '<textarea class="memo-body" id="add-body" placeholder="내용 (선택)"></textarea>' : ''}
        <div style="display:flex; justify-content:flex-end; margin-top:12px;"><button class="btn gray" id="day-close">닫기</button></div>`;
      p.querySelectorAll('[data-i]').forEach(r => r.addEventListener('click', () => {
        const x = all[parseInt(r.getAttribute('data-i'), 10)];
        const t = tasks.find(y => y.id === x.t.id); if (!t) return;
        if (x.kind === 'todo' && isRep(t)) { t.doneDates = t.doneDates || []; const i = t.doneDates.indexOf(x.occ); if (i >= 0) t.doneDates.splice(i, 1); else t.doneDates.push(x.occ); }
        else if (x.kind === 'todo') { t.done = !t.done; t.completedAt = t.done ? iso(new Date()) : null; }
        else setCount(t, ds, (t.completedDates || []).includes(ds) ? 0 : target(t));
        saveTasks(); draw(); render();
      }));
      p.querySelectorAll('[data-memo]').forEach(r => r.addEventListener('click', () => r.classList.toggle('open')));
      p.querySelectorAll('[data-edit-t]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); editing = { kind: 'task', id: b.getAttribute('data-edit-t') }; draw(); }));
      p.querySelectorAll('[data-edit-n]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); editing = { kind: 'note', id: b.getAttribute('data-edit-n') }; draw(); }));
      p.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
        const keep = document.getElementById('add-input').value;
        addType = b.getAttribute('data-type'); draw();
        const el = document.getElementById('add-input'); el.value = keep; el.focus();
      }));
      const add = () => {
        const v = document.getElementById('add-input').value.trim(); if (!v) return;
        const id = 't' + Date.now() + Math.random().toString(36).slice(2, 7);
        const today = iso(new Date());
        const endEl = document.getElementById('add-end');
        const end = endEl && endEl.value && endEl.value > ds ? endEl.value : null;
        const repEl = document.getElementById('add-rep'), lunEl = document.getElementById('add-lunar');
        const rep = repEl && repEl.value !== 'none' ? repEl.value : null;
        const lunar = !!rep && rep !== 'weekly' && rep !== 'monthEnd' && lunEl && lunEl.value === '1';
        const tEl = document.getElementById('add-time'); const time = tEl && tEl.value ? tEl.value : null;
        if (addType === 'memo') {
          const body = (document.getElementById('add-body') || {}).value || '';
          notes.unshift({ id: 'n' + Date.now() + Math.random().toString(36).slice(2, 6), title: v, body, color: '', pinned: false, date: ds, endDate: end, repeat: rep, lunar, important: !!addImp, createdAt: Date.now(), updatedAt: Date.now() });
          saveNotes();
        } else if (addType === 'todo') {
          tasks.unshift({ id, type: 'todo', title: v, category: null, memo: '', done: false, createdAt: today, completedAt: null, dueDate: ds, endDate: end, repeat: rep, lunar, doneDates: [], time, remindBefore: time ? 0 : null, reminderTime: time, important: !!addImp });
          saveTasks();
        } else {
          tasks.unshift({ id, type: 'habit', frequency: addType, title: v, category: null, memo: '',
            repeatDays: addType === 'weekly' ? [d.getDay()] : [0, 1, 2, 3, 4, 5, 6], monthDay: addType === 'monthly' ? md : 1,
            completedDates: [], target: 1, counts: {}, pauses: [], reminderTime: null, createdAt: ds, startDate: ds });
          saveTasks();
        }
        addImp = false;
        draw(); render();
        setTimeout(() => { const el = document.getElementById('add-input'); if (el) el.focus(); }, 30);
      };
      document.getElementById('add-btn').onclick = add;
      const impBtn = document.getElementById('add-imp');
      if (impBtn) impBtn.onclick = () => {
        const keep = document.getElementById('add-input').value;
        const ev = document.getElementById('add-end'), rv = document.getElementById('add-rep'), lv = document.getElementById('add-lunar');
        const st = [ev && ev.value, rv && rv.value, lv && lv.value];
        const tv = document.getElementById('add-time'), tval = tv && tv.value;
        addImp = !addImp; draw();
        document.getElementById('add-input').value = keep;
        if (st[0]) document.getElementById('add-end').value = st[0];
        if (tval && document.getElementById('add-time')) document.getElementById('add-time').value = tval;
        if (st[1]) { document.getElementById('add-rep').value = st[1]; document.getElementById('add-lunar').value = st[2]; document.getElementById('add-rep').onchange(); }
      };
      const repEl = document.getElementById('add-rep'), lunEl = document.getElementById('add-lunar');
      if (repEl) {
        const lt = lunarText(d).replace('(음)', '').replace('윤', ''); // 예: '9.3'
        const lm = lt.split('.')[0], ldd = lt.split('.')[1];
        const desc = () => {
          lunEl.style.display = repEl.value === 'monthly' || repEl.value === 'yearly' ? '' : 'none';
          const r = repEl.value, lu = lunEl.value === '1' && r !== 'weekly';
          // 고른 칸 안에도 날짜가 바로 보이게 (양력/음력에 맞춰 바뀜)
          if (r === 'monthEnd') lunEl.style.display = 'none';
          repEl.querySelector('[value="monthly"]').textContent = lu && ldd ? `매달 음력 ${ldd}일` : `매달 ${md}일`;
          repEl.querySelector('[value="yearly"]').textContent = (lu && ldd ? `매년 음력 ${lm}월 ${ldd}일` : `매년 ${d.getMonth() + 1}월 ${md}일`) + ' (생일·기념일)';
          let txt = '';
          if (r !== 'none') {
            try { txt = RP.describe(ds, r, lu); } catch (e) {}
            if (!txt) txt = r === 'monthEnd' ? '매달 말일' : r === 'weekly' ? `매주 ${wd}요일` : r === 'monthly' ? (lu ? `매달 음력 ${ldd}일` : `매달 ${md}일`) : (lu ? `매년 음력 ${lm}월 ${ldd}일` : `매년 ${d.getMonth() + 1}월 ${md}일`);
          }
          const el = document.getElementById('add-rep-desc');
          el.textContent = txt ? '🔁 ' + txt + '마다 반복돼요' : '';
          el.style.color = txt ? col(addType) : '';
        };
        repEl.onchange = desc; lunEl.onchange = desc; desc();
      }
      document.getElementById('add-input').addEventListener('keydown', e => { if (e.key === 'Enter' && addType !== 'memo') add(); });
      document.getElementById('day-close').onclick = () => p.classList.remove('show');
    }
    draw();
    p.classList.add('show');
  }

  // ---- 설정 ----
  function openSettings() {
    const p = document.getElementById('set-panel');
    const CS = window.CloudSync;
    const tg = (k, label, sub) => `<div class="set"><span>${label}${sub ? `<br><small style="color:var(--muted)">${sub}</small>` : ''}</span><button class="tg ${desk[k] ? 'on' : ''}" data-k="${k}"></button></div>`;
    p.innerHTML = `<h3>⚙ 바탕화면 달력 설정</h3>
      <div class="set"><span>배경 진하기 <b id="alpha-val">${desk.alpha}%</b><br><small style="color:var(--muted)">0%면 완전 투명</small></span><input type="range" min="0" max="100" step="5" id="alpha" value="${desk.alpha}" /></div>
      <div class="set"><span>배경 색</span><div class="seg" data-seg="style"><button data-v="dark">어둡게 (흰 글씨)</button><button data-v="light">밝게 (검은 글씨)</button></div></div>
      <div class="set"><span>글자 크기</span><div class="seg" data-seg="font"><button data-v="small">작게</button><button data-v="mid">보통</button><button data-v="big">크게</button><button data-v="huge">아주 크게</button></div></div>
      ${tg('lunar', '음력 날짜 표시')}
      ${tg('todo', '◆ 할일 표시')}
      ${tg('weekly', '■ 매주 습관 표시')}
      ${tg('monthly', '▲ 매달 습관 표시')}
      ${tg('daily', '● 매일 습관 표시', '매일 나와서 칸이 꽉 찰 수 있어요')}
      ${tg('memo', '✎ 날짜 메모 표시')}
      ${tg('mood', '😊 하루 기분 표시')}
      ${DB ? tg('onTop', '항상 다른 창 위에 표시', '끄면 다른 창 뒤로 가요') + tg('autoStart', '윈도우 켤 때 자동 실행') : ''}
      <div class="set"><span>구글 계정</span><span>${CS && CS.user ? esc(CS.user.email || '') + ' <button class="btn gray" id="logout" style="padding:4px 9px;">로그아웃</button>' : '<button class="btn" id="login2">Google 로그인</button>'}</span></div>
      <div class="note">기호: <b style="color:${col('daily')}">● 매일</b> · <b style="color:${col('weekly')}">■ 매주</b> · <b style="color:${col('monthly')}">▲ 매달</b> · <b style="color:${col('todo')}">◆ 할일</b> · <b style="color:${col('memo')}">✎ 메모</b> (완료하면 ✓)</div>
      <div class="note">🔒 버튼을 누르면 🔓 이동 모드가 돼요. 위쪽 막대를 끌어 위치를 옮기고, 오른쪽 아래 모서리를 끌어 크기를 바꾼 뒤 다시 🔒을 누르면 고정돼요.<br>날짜를 누르면 그날 할 일을 체크하거나 새 할일을 추가할 수 있어요.</div>
      <div style="display:flex; justify-content:flex-end; margin-top:12px;"><button class="btn" id="set-close">닫기</button></div>`;
    p.querySelectorAll('[data-seg]').forEach(seg => {
      const k = seg.getAttribute('data-seg');
      seg.querySelectorAll('button').forEach(b => {
        b.classList.toggle('on', desk[k] === b.getAttribute('data-v'));
        b.onclick = () => { desk[k] = b.getAttribute('data-v'); saveDesk(); render(); openSettings(); };
      });
    });
    p.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.getAttribute('data-k'); desk[k] = !desk[k]; saveDesk();
      if (k === 'onTop' && DB) DB.setAlwaysOnTop(desk.onTop);
      if (k === 'autoStart' && DB) DB.setAutoStart(desk.autoStart);
      render(); openSettings();
    });
    const a = document.getElementById('alpha');
    a.oninput = () => { desk.alpha = parseInt(a.value, 10); document.getElementById('alpha-val').textContent = desk.alpha + '%'; applyLook(); };
    a.onchange = () => saveDesk();
    const lo = document.getElementById('logout'); if (lo) lo.onclick = async () => { await CS.signOut(); openSettings(); render(); };
    const li = document.getElementById('login2'); if (li) li.onclick = startLogin;
    document.getElementById('set-close').onclick = () => p.classList.remove('show');
    p.classList.add('show');
  }

  // ---- 버튼 ----
  document.getElementById('b-prev').onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } render(); };
  document.getElementById('b-quick').onclick = openQuick;
  document.getElementById('b-next').onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } render(); };
  document.getElementById('b-today').onclick = () => { const n = new Date(); viewY = n.getFullYear(); viewM = n.getMonth(); render(); };
  document.getElementById('b-set').onclick = openSettings;
  document.getElementById('b-app').onclick = () => { if (DB && DB.openApp) DB.openApp(); else window.open('index.html', '_blank'); };
  document.getElementById('b-lock').onclick = () => {
    desk.locked = !desk.locked; saveDesk(); applyLook();
    if (DB && DB.setLocked) DB.setLocked(desk.locked);
  };
  // 크기 조절 손잡이 (이동 모드에서만)
  const grip = document.getElementById('grip');
  grip.addEventListener('pointerdown', (e) => {
    if (desk.locked || !DB || !DB.resizeBy) return;
    e.preventDefault(); grip.setPointerCapture(e.pointerId);
    let lx = e.screenX, ly = e.screenY;
    const mv = (ev) => { const dx = ev.screenX - lx, dy = ev.screenY - ly; lx = ev.screenX; ly = ev.screenY; if (dx || dy) DB.resizeBy(dx, dy); };
    const up = () => { grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up); setTimeout(render, 50); };
    grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up);
  });
  window.addEventListener('resize', () => { clearTimeout(window.__rt); window.__rt = setTimeout(render, 120); });
  // 다른 창(앱 창)에서 바꾸면 바로 반영
  window.addEventListener('storage', (e) => { if ([KEY_TASKS, KEY_LOGS, KEY_SET, KEY_NOTES].includes(e.key)) render(); });
  // 날짜가 바뀌면 자동으로 새로 그리기
  let lastDay = iso(new Date());
  setInterval(() => { const t = iso(new Date()); if (t !== lastDay) { lastDay = t; const n = new Date(); viewY = n.getFullYear(); viewM = n.getMonth(); render(); } }, 60000);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.panel').forEach(p => p.classList.remove('show')); });

  // ---- 클라우드 ----
  if (window.CloudSync) {
    const CS = window.CloudSync;
    CS.chooseOnFirstLogin = () => Promise.resolve('merge');
    CS.onRemoteApplied = () => render();
    CS.onStatus = () => renderCloud();
    CS.init();
  }
  load();
  if (DB) { DB.setLocked(desk.locked); DB.setAlwaysOnTop(desk.onTop); if (DB.ready) DB.ready(desk); }
  render();
})();
</script>
</body>
</html>
