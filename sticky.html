<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포스트잇 메모</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
  .note { position: absolute; inset: 6px; border-radius: 10px; display: flex; flex-direction: column; background: var(--bg, #FFF1A8); color: #3A3326;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22); overflow: hidden; }
  .head { display: flex; align-items: center; gap: 4px; padding: 6px 6px 4px 10px; background: rgba(0,0,0,0.06); -webkit-app-region: drag; user-select: none; cursor: move; }
  .head input { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 14px; font-weight: 800; color: inherit; outline: none; -webkit-app-region: no-drag; padding: 2px 0; }
  .head button { -webkit-app-region: no-drag; border: none; background: transparent; cursor: pointer; font-size: 14px; width: 24px; height: 24px; border-radius: 6px; color: inherit; opacity: .65; }
  .head button:hover { background: rgba(0,0,0,0.1); opacity: 1; }
  .meta { font-size: 11px; padding: 2px 10px 0; opacity: .7; font-weight: 700; }
  textarea { flex: 1; border: none; background: transparent; resize: none; font: inherit; font-size: 13.5px; line-height: 1.55; color: inherit; padding: 6px 10px 10px; outline: none; }
  .grip { position: absolute; right: 6px; bottom: 6px; width: 16px; height: 16px; cursor: nwse-resize; opacity: .4;
    background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.35) 50%, rgba(0,0,0,.35) 60%, transparent 60%, transparent 75%, rgba(0,0,0,.35) 75%, rgba(0,0,0,.35) 85%, transparent 85%); }
  .menu { position: absolute; top: 36px; right: 10px; background: #fff; color: #222; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.25); padding: 6px; display: none; z-index: 5; min-width: 170px; }
  .menu.show { display: block; }
  .menu .cols { display: flex; gap: 6px; padding: 4px 4px 8px; }
  .menu .cols span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); cursor: pointer; }
  .menu .cols span.on { border-color: #333; }
  .menu button { display: block; width: 100%; text-align: left; border: none; background: transparent; font: inherit; font-size: 13px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
  .menu button:hover { background: #F0F0F0; }
  .pick { position: absolute; inset: 0; background: #FFFDF5; z-index: 8; display: none; flex-direction: column; color: #2A2A2A; }
  .pick.show { display: flex; }
  .pick .ph { display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px 12px; font-weight: 800; font-size: 13.5px; }
  .pick .ph span { flex: 1; }
  .pick .ph button { border: none; background: transparent; cursor: pointer; font-size: 14px; width: 24px; height: 24px; border-radius: 6px; }
  .pick .ph button:hover { background: #EEE; }
  .pick .new { margin: 0 8px 6px; border: 1.5px dashed #C9B66A; background: #FFF4C2; border-radius: 8px; padding: 7px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .pick input { margin: 0 8px 6px; border: 1px solid #DDD; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; outline: none; }
  .pick .list { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
  .pick .it { display: flex; align-items: center; gap: 8px; padding: 7px 6px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .pick .it:hover { background: #F3EFE0; }
  .pick .it .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.15); }
  .pick .it .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .it .tx small { color: #888; margin-left: 4px; }
  .pick .it .on { font-size: 11px; color: #B08A00; font-weight: 800; flex: none; }
  .pick .empty { text-align: center; color: #888; font-size: 12.5px; padding: 18px 8px; }
  .items { padding: 2px 10px 0; max-height: 45%; overflow-y: auto; }
  .ci { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 2px 0; }
  .ci .bx { width: 15px; height: 15px; border-radius: 4px; border: 1.6px solid rgba(0,0,0,.45); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; cursor: pointer; flex: none; }
  .ci.on .bx { background: rgba(0,0,0,.55); color: #fff; border-color: transparent; }
  .ci.on .tx { text-decoration: line-through; opacity: .55; }
  .ci .tx { flex: 1; min-width: 0; word-break: break-word; }
  .ci .dl { opacity: 0; border: none; background: transparent; cursor: pointer; font-size: 11px; }
  .ci:hover .dl { opacity: .5; }
  .ci.add input { flex: 1; border: none; border-bottom: 1px dashed rgba(0,0,0,.25); background: transparent; font: inherit; font-size: 12.5px; outline: none; padding: 2px 0; color: inherit; }
  .lockbox { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 13px; padding: 10px; text-align: center; }
  .lockbox input { width: 110px; text-align: center; font-size: 18px; letter-spacing: 6px; border: 1px solid rgba(0,0,0,.2); border-radius: 8px; padding: 5px; background: rgba(255,255,255,.6); }
  .saved { position: absolute; left: 12px; bottom: 6px; font-size: 10.5px; opacity: 0; transition: opacity .3s; }
  .saved.on { opacity: .55; }
  .gone { padding: 24px 12px; text-align: center; font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<div class="note" id="note"></div>
<script src="repeat.js"></script>
<script>
(function () {
  const KEY_NOTES = 'notes_v1';
  const id = new URLSearchParams(location.search).get('id') || '';
  const BR = window.DesktopBridge || {};
  // 포스트잇 색 (폰 메모 색과 같은 이름)
  const COLORS = [
    { key: 'yellow', bg: '#FFEB99' }, { key: 'green', bg: '#C8EFD4' }, { key: 'blue', bg: '#C9DEF7' },
    { key: 'pink', bg: '#F9CFDF' }, { key: 'purple', bg: '#DED3F4' }, { key: '', bg: '#FFF7D1' }
  ];
  const bgOf = k => (COLORS.find(c => c.key === (k || '')) || COLORS[0]).bg;
  const el = document.getElementById('note');
  let note = null, saveTimer = null;

  function readAll() { try { return JSON.parse(localStorage.getItem(KEY_NOTES) || '[]') || []; } catch (e) { return []; } }
  function writeNote(patch) {
    const all = readAll();
    const i = all.findIndex(n => n.id === id);
    if (i < 0) return;
    all[i] = Object.assign({}, all[i], patch, { updatedAt: Date.now() });
    note = all[i];
    try { localStorage.setItem(KEY_NOTES, JSON.stringify(all)); } catch (e) {}
    const s = document.getElementById('saved'); if (s) { s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 900); }
  }
  function md(ds) { return (+ds.slice(5, 7)) + '/' + (+ds.slice(8, 10)); }
  function metaText(n) {
    if (!n.date) return '';
    let t = '📅 ' + md(n.date) + (n.endDate && n.endDate > n.date ? ' ~ ' + md(n.endDate) : '');
    try { if (window.Repeat && window.Repeat.isRepeat(n.repeat)) t += ' · 🔁 ' + window.Repeat.describe(n.date, n.repeat, !!n.lunar); } catch (e) {}
    return (n.important ? '⭐ ' : '') + t;
  }

  let unlocked = false;
  function pinHash(pin) { let h = 2166136261; const str = 'kokbu-memo:' + pin; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return 'p' + h.toString(36); }
  function pinHashSet() { try { return (JSON.parse(localStorage.getItem('app_settings_v1') || '{}') || {}).memoPinHash || ''; } catch (e) { return ''; } }
  function render() {
    note = readAll().find(n => n.id === id) || null;
    if (note && note.locked && pinHashSet() && !unlocked) {
      el.style.setProperty('--bg', bgOf(note.color || 'yellow'));
      el.innerHTML = `<div class="head"><input value="🔒 ${(note.title || '잠긴 메모').replace(/"/g, '&quot;')}" disabled /><button id="b-x" title="바탕화면에서 떼기">✕</button></div>
        <div class="lockbox">잠긴 메모예요<br>PIN 4자리를 넣으면 열려요<input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" /><span id="pinmsg" style="color:#C1543D; font-size:12px;"></span></div>`;
      document.getElementById('b-x').onclick = () => BR.unpinNote && BR.unpinNote(id);
      const pi = document.getElementById('pin');
      pi.oninput = () => { if (pi.value.length < 4) return; if (pinHash(pi.value) === pinHashSet()) { unlocked = true; render(); } else { document.getElementById('pinmsg').textContent = 'PIN이 달라요'; pi.value = ''; } };
      setTimeout(() => pi.focus(), 50);
      return;
    }
    if (!note) {
      el.style.setProperty('--bg', '#EEE');
      el.innerHTML = `<div class="head"><input value="삭제된 메모" disabled /><button id="b-x" title="바탕화면에서 떼기">✕</button></div>
        <div class="gone">이 메모는 폰이나 다른 곳에서 삭제됐어요.<br>✕를 눌러 떼어주세요.</div>`;
      document.getElementById('b-x').onclick = () => BR.unpinNote && BR.unpinNote(id);
      return;
    }
    el.style.setProperty('--bg', bgOf(note.color || 'yellow'));
    el.innerHTML = `<div class="head">
        <input id="t" placeholder="제목" maxlength="80" />
        <button id="b-new" title="포스트잇 더 붙이기 (새로 만들기 / 메모장에서 꺼내기)">＋</button>
        <button id="b-menu" title="색·삭제">⋯</button>
        <button id="b-x" title="바탕화면에서 떼기 (메모는 남아요)">✕</button>
      </div>
      <div class="meta" id="meta">${metaText(note)}</div>
      <div class="items" id="items"></div>
      <textarea id="b" placeholder="여기에 메모를 적어요 (자동 저장)"></textarea>
      <div class="saved" id="saved">저장됨 ✓</div>
      <div class="grip" id="grip" title="끌어서 크기 조절"></div>
      <div class="menu" id="menu">
        <div class="cols">${COLORS.slice(0, 5).map(c => `<span data-c="${c.key}" style="background:${c.bg}" class="${(note.color || 'yellow') === c.key ? 'on' : ''}"></span>`).join('')}</div>
        <button id="m-app">📱 앱에서 열기 (날짜·반복 바꾸기)</button>
        <button id="m-del" style="color:#C1543D;">🗑 메모 삭제하기</button>
      </div>`;
    const t = document.getElementById('t'), b = document.getElementById('b');
    drawItems();
    t.value = note.title || ''; b.value = note.body || '';
    const later = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => writeNote({ title: t.value.trim(), body: b.value }), 500); };
    t.addEventListener('input', later); b.addEventListener('input', later);
    t.addEventListener('blur', () => { clearTimeout(saveTimer); writeNote({ title: t.value.trim(), body: b.value }); });
    b.addEventListener('blur', () => { clearTimeout(saveTimer); writeNote({ title: t.value.trim(), body: b.value }); });
    document.getElementById('b-x').onclick = () => { clearTimeout(saveTimer); writeNote({ title: t.value.trim(), body: b.value }); BR.unpinNote && BR.unpinNote(id); };
    document.getElementById('b-new').onclick = openPick;
    const menu = document.getElementById('menu');
    document.getElementById('b-menu').onclick = (e) => { e.stopPropagation(); menu.classList.toggle('show'); };
    menu.querySelectorAll('[data-c]').forEach(s => s.onclick = () => { writeNote({ color: s.getAttribute('data-c') }); render(); });
    document.getElementById('m-app').onclick = () => { menu.classList.remove('show'); BR.openApp && BR.openApp(); };
    document.getElementById('m-del').onclick = () => {
      if (!confirm('이 메모를 완전히 삭제할까요? 폰 메모장에서도 지워져요.')) return;
      const all = readAll().filter(n => n.id !== id);
      try { localStorage.setItem(KEY_NOTES, JSON.stringify(all)); } catch (e) {}
      BR.unpinNote && BR.unpinNote(id);
    };
    // 크기 조절 (창 테두리가 없어서 오른쪽 아래 손잡이로)
    const grip = document.getElementById('grip');
    grip.addEventListener('mousedown', (e) => {
      e.preventDefault();
      let lx = e.screenX, ly = e.screenY;
      const mv = (ev) => { const dx = ev.screenX - lx, dy = ev.screenY - ly; if (Math.abs(dx) + Math.abs(dy) < 3) return; lx = ev.screenX; ly = ev.screenY; BR.resizeSticky && BR.resizeSticky(id, dx, dy); };
      const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
      window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
    });
  }

  // ☑ 체크 목록: 체크·추가·지우기
  function drawItems() {
    const box = document.getElementById('items'); if (!box || !note) return;
    const it = Array.isArray(note.items) ? note.items : [];
    const esc = t => String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    box.innerHTML = it.map(x => `<div class="ci ${x.done ? 'on' : ''}"><span class="bx" data-tg="${esc(x.id)}">${x.done ? '✓' : ''}</span><span class="tx">${esc(x.t)}</span><button class="dl" data-dl="${esc(x.id)}" title="지우기">✕</button></div>`).join('')
      + `<div class="ci add"><span class="bx" style="border-style:dashed;">＋</span><input id="newitem" placeholder="체크 항목 추가 후 Enter" maxlength="80" /></div>`;
    const save = (arr) => { writeNote({ items: arr }); drawItems(); };
    box.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => save(it.map(x => x.id === b.getAttribute('data-tg') ? Object.assign({}, x, { done: !x.done }) : x)));
    box.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => save(it.filter(x => x.id !== b.getAttribute('data-dl'))));
    const ni = document.getElementById('newitem');
    ni.onkeydown = (e) => { if (e.key !== 'Enter') return; e.preventDefault(); const v = ni.value.trim(); if (!v) return; save(it.concat({ id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), t: v, done: false })); const n2 = document.getElementById('newitem'); if (n2) n2.focus(); };
  }

  // 다른 창(바탕화면 달력·폰에서 받은 내용)에서 바뀌면 다시 그리기 — 글을 쓰는 중이면 건드리지 않음
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY_NOTES) return;
    const a = document.activeElement;
    if (a && (a.id === 't' || a.id === 'b' || a.id === 'newitem' || a.id === 'pin')) {
      const n = readAll().find(x => x.id === id);
      if (!n) render(); else { const m = document.getElementById('meta'); if (m) m.textContent = metaText(n); if (a.id !== 'newitem') { note = n; drawItems(); } }
      return;
    }
    render();
  });
  // ＋ : 빈 포스트잇 새로 만들기 또는 메모장에 있는 메모 꺼내기
  const pick = document.createElement('div');
  pick.className = 'pick';
  document.body.appendChild(pick);
  function openPick() {
    const m = document.getElementById('menu'); if (m) m.classList.remove('show');
    const pinP = BR.pinnedNotes ? BR.pinnedNotes() : Promise.resolve([]);
    pinP.then(ids => drawPick(new Set(ids || []), '')).catch(() => drawPick(new Set(), ''));
  }
  function drawPick(pinned, q) {
    const all = readAll().filter(n => n.id !== id);
    const qq = q.trim().toLowerCase();
    const list = all.filter(n => !qq || (n.title || '').toLowerCase().includes(qq) || (!n.locked && (n.body || '').toLowerCase().includes(qq)))
      .sort((a, b) => (pinned.has(a.id) ? 1 : 0) - (pinned.has(b.id) ? 1 : 0) || (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.updatedAt || 0) - (a.updatedAt || 0));
    const esc = t => String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    pick.innerHTML = `<div class="ph"><span>＋ 포스트잇 더 붙이기</span><button id="p-x" title="닫기">✕</button></div>
      <button class="new" id="p-new">✨ 빈 포스트잇 새로 만들기</button>
      <input id="p-q" placeholder="🔍 메모장에서 찾기" value="${esc(q)}" />
      <div class="list">${list.length ? list.map(n => {
        const title = (n.locked ? '🔒 ' : '') + (n.title || (n.locked ? '잠긴 메모' : (n.body || '').split('\n')[0]) || '빈 메모');
        const sub = n.locked ? '' : n.title ? (n.body || '').split('\n')[0] : '';
        return `<div class="it" data-pick="${esc(n.id)}"><span class="dot" style="background:${bgOf(n.color || 'yellow')}"></span><span class="tx">${n.important ? '⭐' : ''}${esc(title)}<small>${esc(sub).slice(0, 30)}</small></span>${pinned.has(n.id) ? '<span class="on">📌 붙어 있음</span>' : ''}</div>`;
      }).join('') : `<div class="empty">${qq ? '찾는 메모가 없어요' : '메모장에 다른 메모가 없어요'}</div>`}</div>`;
    pick.classList.add('show');
    document.getElementById('p-x').onclick = () => pick.classList.remove('show');
    document.getElementById('p-new').onclick = () => { pick.classList.remove('show'); BR.newSticky && BR.newSticky(); };
    const qi = document.getElementById('p-q');
    qi.oninput = () => { const v = qi.value; drawPick(pinned, v); const n = document.getElementById('p-q'); n.focus(); n.setSelectionRange(v.length, v.length); };
    pick.querySelectorAll('[data-pick]').forEach(r => r.onclick = () => { BR.pinNote && BR.pinNote(r.getAttribute('data-pick')); pick.classList.remove('show'); });
  }

  document.addEventListener('click', (e) => { const m = document.getElementById('menu'); if (m && !m.contains(e.target) && e.target.id !== 'b-menu') m.classList.remove('show'); });
  render();
})();
</script>
</body>
</html>
