<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>물건 위치 · 생활노트</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#F3F4F6" />
<link rel="stylesheet" href="life.css?v=20261010e" />
<script>try{if(localStorage.getItem('dark_mode_v1')==='1')document.documentElement.classList.add('ln-dark')}catch(e){}</script>
<style>
  .search{font-size:17px!important;padding:14px 16px!important}
  .thing{cursor:pointer;align-items:flex-start!important}
  .thing:hover{background:var(--surface2)}
  .where{font-size:15px;font-weight:650;color:var(--primary-dark)}
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
  .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--surface2)}
  .ph-big{width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:var(--surface2)}
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <span class="date" id="today"></span>
    <h1>물건 어디 뒀더라</h1>
    <p>여권·보증서·계약서·계절 옷처럼 가끔 찾는 물건을 어디 뒀는지 적어두고 검색해요.</p>
  </header>

  <section class="card">
    <input id="q" class="search" type="search" placeholder="무엇을 찾나요? (예: 여권, 보증서)" aria-label="물건 찾기" />
    <div class="chips" id="cats"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2 id="count">물건</h2><button class="btn sm soft" type="button" id="add">+ 물건</button></div>
    <ul class="list" id="list"></ul>
  </section>
</main>

<script src="firebase.js?v=20261010e"></script>
<script src="sync.js?v=20261010e"></script>
<script src="life-config.js?v=20261010e"></script>
<script src="life.js?v=20261010e"></script>
<script src="shell.js?v=20261010e"></script>
<script src="notify.js?v=20261010e"></script>
<script src="import.js?v=20261010e"></script>
<script>
(function () {
  const { h, today, prettyDate, toast, sheet } = Life;
  const T = Life.store('things');
  const $ = id => document.getElementById(id);
  $('today').textContent = prettyDate(today());
  const CATS = ['서류', '전자기기', '계절용품', '공구', '약·구급', '추억', '기타'];
  let cat = '', q = '';

  /* 사진: 줄여서 이 기기(IndexedDB)에만 저장 — 용량이 커서 클라우드에는 올리지 않아요 */
  const PH = (() => {
    let dbp = null;
    const db = () => dbp || (dbp = new Promise((ok, no) => { const r = indexedDB.open('life_photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }));
    const tx = async (mode, fn) => { const d = await db(); return new Promise((ok, no) => { const t = d.transaction('p', mode); const req = fn(t.objectStore('p')); t.oncomplete = () => ok(req && req.result); t.onerror = () => no(t.error); }); };
    const urls = {};
    return {
      get: id => tx('readonly', st => st.get(id)),
      put: (id, blob) => { delete urls[id]; return tx('readwrite', st => st.put(blob, id)); },
      del: id => { delete urls[id]; return tx('readwrite', st => st.delete(id)); },
      async url(id) { if (urls[id]) return urls[id]; const b = await this.get(id).catch(() => null); return b ? (urls[id] = URL.createObjectURL(b)) : null; }
    };
  })();
  function shrink(file) {
    return new Promise((ok, no) => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob(b => b ? ok(b) : no(new Error('사진을 줄이지 못했어요')), 'image/jpeg', 0.78);
      };
      img.onerror = () => { URL.revokeObjectURL(u); no(new Error('사진을 열지 못했어요')); };
      img.src = u;
    });
  }

  function form(x) {
    x = x || {};
    const name = h('input', { type: 'text', maxlength: '30', value: x.name || q || '', placeholder: '예: 여권' });
    const where = h('input', { type: 'text', maxlength: '50', value: x.where || '', placeholder: '예: 안방 옷장 맨 위 칸, 파란 상자' });
    const c = Life.choice({ options: CATS, value: x.cat || '서류', extra: () => Life.usedValues(T.items(), 'cat', CATS), placeholder: '예: 캠핑용품, 아기용품' });
    const memo = h('input', { type: 'text', maxlength: '60', value: x.memo || '', placeholder: '예: 2031년 만료, 보증기간 2027년 3월까지' });
    // 사진
    let newPhoto = null, dropPhoto = false;
    const prev = h('img', { class: 'ph-big', alt: '물건 사진', hidden: true });
    const pfile = h('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true });
    const pnote = h('p', { class: 'tiny muted', style: 'margin:0' }, '사진은 이 기기에만 저장돼요. 다른 기기에서는 "사진 있음"으로만 보여요.');
    const pdel = h('button', { class: 'btn sm ghost', type: 'button', hidden: true, onclick: () => { dropPhoto = true; newPhoto = null; prev.hidden = true; pdel.hidden = true; } }, '사진 빼기');
    pfile.addEventListener('change', async () => {
      const f = pfile.files[0]; if (!f) return;
      try { newPhoto = await shrink(f); dropPhoto = false; prev.src = URL.createObjectURL(newPhoto); prev.hidden = false; pdel.hidden = false; } catch (e) { toast(e.message); }
    });
    if (x.id) PH.url(x.id).then(u => { if (u) { prev.src = u; prev.hidden = false; pdel.hidden = false; } else if (x.hasPhoto) pnote.textContent = '이 물건의 사진은 다른 기기에서 찍었어요. 여기서 새로 찍을 수 있어요.'; });
    const photoBox = h('div', { class: 'field' }, h('span', { class: 'label' }, '사진 (선택)'), prev,
      h('div', { class: 'row' }, h('button', { class: 'btn sm soft', type: 'button', onclick: () => pfile.click() }, '사진 찍기·고르기'), pdel, pfile), pnote);
    let armed = false;
    const del = x.id ? h('button', { class: 'btn ghost', type: 'button', onclick: () => {
      if (!armed) { armed = true; del.textContent = '한 번 더 누르면 삭제'; del.style.color = 'var(--danger)'; return; }
      T.remove(x.id); PH.del(x.id).catch(() => {}); close(); toast('삭제했어요');
    } }, '삭제') : null;
    const close = sheet(x.id ? '물건 고치기' : '물건 추가', h('div', { class: 'stack' },
      h('label', { class: 'field' }, h('span', { class: 'label' }, '무엇'), name),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '어디에'), where),
      h('div', { class: 'field' }, h('span', { class: 'label' }, '종류'), c.el),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '메모'), memo),
      photoBox,
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => {
        if (!name.value.trim() || !where.value.trim()) { toast('무엇을 어디에 뒀는지 적어 주세요'); return; }
        const it = T.put(Object.assign({}, x, { name: name.value.trim(), where: where.value.trim(), cat: c.get() || '기타', memo: memo.value.trim(), moved: today(),
          hasPhoto: newPhoto ? true : dropPhoto ? false : !!x.hasPhoto }));
        if (newPhoto) PH.put(it.id, newPhoto).then(render).catch(() => toast('사진을 저장하지 못했어요. 기기 저장 공간을 확인해 주세요.'));
        else if (dropPhoto) PH.del(it.id).then(render);
        close(); toast('저장했어요');
      } }, '저장'), h('span', { class: 'spacer' }), del)));
  }
  $('add').onclick = () => form();
  $('q').addEventListener('input', e => { q = e.target.value.trim(); render(); });
  const q0 = new URLSearchParams(location.search).get('q'); if (q0) { $('q').value = q0; q = q0.trim(); }

  function hl(text) { // 찾는 말에 형광펜
    if (!q) return text;
    const i = text.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return text;
    return [text.slice(0, i), h('mark', {}, text.slice(i, i + q.length)), text.slice(i + q.length)];
  }
  function render() {
    const all = T.items();
    const used = CATS.concat(Life.usedValues(all, 'cat', CATS)).filter(c => all.some(x => x.cat === c));
    $('cats').replaceChildren(...(used.length > 1 ? [''].concat(used).map(c => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(cat === c), onclick: () => { cat = c; render(); } }, c || '전체')) : []));
    const ql = q.toLowerCase();
    const list = all.filter(x => (!cat || x.cat === cat) && (!q || [x.name, x.where, x.memo].join(' ').toLowerCase().includes(ql)))
      .sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    $('count').textContent = q ? '"' + q + '" 찾은 결과 ' + list.length + '개' : '물건 ' + all.length + '개';
    $('list').replaceChildren(...(list.length ? list.map(x => h('li', { class: 'thing', tabindex: '0', role: 'button', onclick: () => form(x), onkeydown: e => { if (e.key === 'Enter') form(x); } },
      (() => { const im = h('img', { class: 'ph', alt: '', hidden: true }); PH.url(x.id).then(u => { if (u) { im.src = u; im.hidden = false; } }); return im; })(),
      h('div', { class: 'grow' }, h('div', { class: 'row', style: 'gap:6px' }, h('b', {}, hl(x.name)), h('span', { class: 'badge' }, x.cat), x.hasPhoto ? h('span', { class: 'badge go' }, '사진') : null), h('div', { class: 'where' }, hl(x.where)),
        h('div', { class: 'tiny muted' }, (x.memo ? x.memo + ' · ' : '') + prettyDate(x.moved || today()) + ' 기록'))))
      : [h('li', { class: 'empty' }, q ? h('span', {}, '"' + q + '"은(는) 기록이 없어요. ', h('button', { class: 'btn sm', type: 'button', onclick: () => form() }, '"' + q + '" 위치 적기')) : '"+ 물건"으로 가끔 찾는 물건이 어디 있는지 적어 보세요.')]));
  }

  // 엑셀로 넣기·받기
  Life.excel({ store: T, title: '물건 위치',
    fields: [
      { key: 'name', label: '물건', type: 'text', required: true, aliases: ['이름', '무엇', '품목'] },
      { key: 'where', label: '위치', type: 'text', required: true, aliases: ['어디', '어디에', '장소', '보관위치', '둔곳'] },
      { key: 'cat', label: '종류', type: 'choice', aliases: ['분류', '카테고리'], options: CATS.map(c => [c]), keepRaw: true },
      { key: 'memo', label: '메모', type: 'text', aliases: ['비고', '참고'] }
    ],
    toItem: v => !v.name ? { error: '물건 이름이 없어요' } : !v.where ? { error: '위치가 없어요' } : { name: v.name, where: v.where, cat: v.cat || '기타', memo: v.memo || '', moved: today() },
    dupKey: x => [x.name, x.where].join('|'),
    preview: [['물건', x => x.name], ['위치', x => x.where], ['종류', x => x.cat]],
    sample: [['여권', '안방 옷장 맨 위 칸 파란 상자', '서류', '2031년 만료'], ['선풍기', '베란다 창고', '계절용품', '']]
  });
  T.subscribe(render);
  render();
})();
</script>
</body>
</html>
