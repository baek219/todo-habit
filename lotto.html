<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>로또 번호 · 생활노트</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#2F6F5E" />
<link rel="stylesheet" href="life.css" />
<script>try{if(localStorage.getItem('dark_mode_v1')==='1')document.documentElement.classList.add('ln-dark')}catch(e){}</script>
<style>
  .balls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ball{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);flex:none}
  .ball.sm{width:30px;height:30px;font-size:12px}
  .ball.hit{outline:3px solid var(--fg);outline-offset:1px}
  .b1{background:#F2B705;color:#3a2a00}.b2{background:#2F7FD0}.b3{background:#E0503A}.b4{background:#8A9590}.b5{background:#3FA64B}
  .plus{color:var(--muted);font-weight:800}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
  .mode{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:12px;padding:11px 13px;cursor:pointer}
  .mode b{display:block}
  .mode:disabled{opacity:.5;cursor:not-allowed}
  .result{min-height:56px;display:grid;gap:10px}
  .freq{display:grid;grid-template-columns:repeat(15,1fr);gap:4px 3px;align-items:end}
  .freq .col{display:grid;gap:3px;justify-items:center}
  .freq .bar-v{width:100%;max-width:18px;border-radius:4px 4px 0 0;background:var(--primary);min-height:2px}
  .freq .col.hot .bar-v{background:var(--accent)}
  .freq .col.cold .bar-v{background:var(--muted)}
  .freq .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .rank{font-weight:800}
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <span class="date" id="today"></span>
    <h1>로또 번호</h1>
    <p>재미로 번호를 뽑고, 저장한 번호가 최근 회차에 몇 개 맞았는지 바로 확인해요.</p>
  </header>

  <section class="card">
    <h2>번호 뽑기</h2>
    <div class="modes">
      <button class="mode" type="button" data-mode="random"><b>무작위</b><span class="small muted">1~45에서 고르게 6개</span></button>
      <button class="mode" type="button" data-mode="hot"><b>자주 나온 번호 조합</b><span class="small muted" id="hot-hint"></span></button>
      <button class="mode" type="button" data-mode="cold"><b>덜 나온 번호 조합</b><span class="small muted" id="cold-hint"></span></button>
    </div>
    <div class="row"><label class="small muted" for="games">한 번에</label>
      <select id="games" style="width:auto"><option value="1">1게임</option><option value="5" selected>5게임</option></select></div>
    <div class="result" id="out"><p class="empty">위에서 방식을 골라 보세요.</p></div>
    <div class="row"><button class="btn primary sm" type="button" id="save" disabled>뽑은 번호 저장</button></div>
    <p class="note">어떤 방식이든 1등 확률은 똑같이 약 814만분의 1이에요. 재미로만 즐겨 주세요.</p>
  </section>

  <section class="card">
    <div class="card-head"><h2>번호별 당첨 횟수</h2><button class="btn sm" type="button" id="load-stats">전체 회차 통계 불러오기</button></div>
    <p class="small muted" id="stat-src"></p>
    <div id="freq-box"></div>
  </section>

  <section class="card">
    <h2>저장한 번호</h2>
    <p class="small muted" id="check-src"></p>
    <ul class="list" id="saved"></ul>
  </section>

</main>

<script src="firebase.js"></script>
<script src="sync.js"></script>
<script src="life-config.js"></script>
<script src="life.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  const { h, today, prettyDate, toast } = Life;
  const L = Life.store('lotto');   // items: {t:'saved', nums, mode} | {t:'draw', round, nums, bonus}
  const $ = id => document.getElementById(id);
  $('today').textContent = prettyDate(today());
  let server = null;               // 서버 통계 {last, counts, recent}
  try { server = JSON.parse(localStorage.getItem('lotto_server_stats_v1')) || null; } catch (e) {}
  let last = [], lastMode = null;
  const MODE = { random: '무작위', hot: '자주 나온', cold: '덜 나온' };

  const cls = n => n <= 10 ? 'b1' : n <= 20 ? 'b2' : n <= 30 ? 'b3' : n <= 40 ? 'b4' : 'b5';
  const ball = (n, sm, hit) => h('span', { class: 'ball ' + cls(n) + (sm ? ' sm' : '') + (hit ? ' hit' : '') }, n);
  function rnd(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function pick6(pool) { const a = [...pool], o = []; while (o.length < 6 && a.length) o.push(a.splice(rnd(a.length), 1)[0]); return o.sort((x, y) => x - y); }
  const draws = () => L.items().filter(x => x.t === 'draw').sort((a, b) => b.round - a.round);

  function source() {
    if (server && server.last) return { counts: server.counts, n: server.last, label: '동행복권 1~' + server.last + '회 전체' };
    const d = draws(); if (!d.length) return null;
    const c = Array(46).fill(0); d.forEach(x => x.nums.forEach(n => c[n]++));
    return { counts: c, n: d.length, label: '직접 기록한 ' + d.length + '개 회차' };
  }
  function ranked(counts) { const a = [...Array(45)].map((_, i) => i + 1); a.sort((x, y) => (counts[y] - counts[x]) || (Math.random() - .5)); return a; }
  function latest() {
    if (server && server.recent && server.recent[0]) { const r = server.recent[0]; return { round: r.r, nums: r.n, bonus: r.b, date: r.d }; }
    const d = draws()[0]; return d ? { round: d.round, nums: d.nums, bonus: d.bonus, date: null } : null;
  }
  function rankOf(nums, w) {
    if (!w) return null;
    const m = nums.filter(n => w.nums.includes(n)).length, b = w.bonus && nums.includes(w.bonus);
    return m === 6 ? '1등' : m === 5 && b ? '2등' : m === 5 ? '3등' : m === 4 ? '4등' : m === 3 ? '5등' : m + '개 맞음';
  }

  /* 뽑기 */
  document.querySelectorAll('.mode').forEach(b => b.onclick = () => {
    const m = b.dataset.mode, src = source();
    let pool = [...Array(45)].map((_, i) => i + 1);
    if (m !== 'random') { const r = ranked(src.counts); pool = m === 'hot' ? r.slice(0, 15) : r.slice(-15); }
    const g = parseInt($('games').value, 10);
    last = []; for (let i = 0; i < g; i++) last.push(pick6(pool)); lastMode = m;
    $('out').replaceChildren(...last.map((nums, i) => h('div', { class: 'balls' }, h('span', { class: 'small muted', style: 'width:22px' }, String.fromCharCode(65 + i)), nums.map(n => ball(n)))));
    $('save').disabled = false;
  });
  $('save').onclick = () => { last.forEach(nums => L.put({ t: 'saved', nums, mode: lastMode, date: today() })); toast(last.length + '게임 저장했어요'); $('save').disabled = true; };

  /* 서버 통계 */
  async function loadStats() {
    if (!Life.hasServer()) { toast('서버 연결 후에 쓸 수 있어요.'); return; }
    if (!Life.user()) { toast('통계는 로그인한 뒤 불러올 수 있어요'); Life.signIn(); return; }
    const btn = $('load-stats'); btn.disabled = true;
    try {
      for (let i = 0; i < 40; i++) {
        btn.textContent = '불러오는 중…' + (server && server.last ? ' (' + server.last + '회까지)' : '');
        const r = await Life.api('lotto/stats');
        server = r; try { localStorage.setItem('lotto_server_stats_v1', JSON.stringify(r)); } catch (e) {}
        render();
        if (r.blocked) { toast('동행복권에서 번호를 가져오지 못했어요. 잠시 뒤 다시 눌러 주세요.'); break; }
        if (r.complete) { toast(r.last + '회까지 통계를 불러왔어요'); break; }
      }
    } catch (e) { toast(e.message || '통계를 불러오지 못했어요'); }
    finally { btn.disabled = false; btn.textContent = '통계 새로 불러오기'; }
  }
  $('load-stats').onclick = loadStats;


  function render() {
    const src = source();
    // 통계가 있을 때만 '자주/덜 나온 번호' 버튼을 보여줌
    ['hot', 'cold'].forEach(m => { document.querySelector('.mode[data-mode="' + m + '"]').hidden = !src; });
    if (src) { $('hot-hint').textContent = src.label + ' 기준 상위 15개 중 6개'; $('cold-hint').textContent = src.label + ' 기준 하위 15개 중 6개'; }
    if (server && server.complete) $('load-stats').textContent = '통계 새로 불러오기';

    // 빈도 그래프
    const fb = $('freq-box'); fb.replaceChildren();
    if (!src) { $('stat-src').textContent = ''; fb.append(h('p', { class: 'empty' }, '"전체 회차 통계 불러오기"를 누르면 번호별 당첨 횟수가 그려지고, 위에 "자주 나온 / 덜 나온 번호 조합" 뽑기가 생겨요.')); }
    else {
      $('stat-src').textContent = src.label + ' 기준 (보너스 번호 제외)';
      const r = ranked(src.counts), hot = new Set(r.slice(0, 15)), cold = new Set(r.slice(-15));
      const max = Math.max(1, ...src.counts.slice(1));
      fb.append(h('div', { class: 'freq', role: 'img', 'aria-label': '1부터 45까지 번호별 당첨 횟수 막대그래프' },
        [...Array(45)].map((_, i) => { const n = i + 1, c = src.counts[n];
          return h('div', { class: 'col' + (hot.has(n) ? ' hot' : cold.has(n) ? ' cold' : ''), title: n + '번: ' + c + '회' },
            h('span', { class: 'n' }, c), h('i', { class: 'bar-v', style: 'height:' + Math.round(8 + c / max * 52) + 'px' }), h('span', { class: 'n', style: 'color:var(--fg);font-weight:700' }, n)); })),
        h('div', { class: 'legend' }, h('span', {}, h('i', { style: 'background:var(--accent)' }), '자주 나온 15개'), h('span', {}, h('i', { style: 'background:var(--muted)' }), '덜 나온 15개'), h('span', {}, h('i', { style: 'background:var(--primary)' }), '그 밖')));
    }

    // 저장한 번호 + 당첨 확인
    const w = latest();
    $('check-src').textContent = w ? w.round + '회 당첨번호와 비교했어요' + (w.date ? ' (' + w.date + ')' : '') : '최근 당첨번호가 있으면 몇 개 맞았는지 알려드려요.';
    const saved = L.items().filter(x => x.t === 'saved').sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    $('saved').replaceChildren(...(saved.length ? saved.slice(0, 30).map(x => {
      const rk = rankOf(x.nums, w);
      return h('li', {}, h('div', { class: 'grow stack', style: 'gap:4px' },
        h('div', { class: 'balls' }, x.nums.map(n => ball(n, true, w && (w.nums.includes(n) || n === w.bonus)))),
        h('span', { class: 'tiny muted' }, MODE[x.mode] + ' · ' + prettyDate(x.date))),
        rk ? h('span', { class: 'badge rank ' + (/등/.test(rk) ? 'go' : '') }, rk) : null,
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': '삭제', onclick: () => L.remove(x.id) }, '✕'));
    }) : [h('li', { class: 'empty' }, '번호를 뽑고 "뽑은 번호 저장"을 누르면 여기에 남아요.')]));
  }
  L.subscribe(render);
  render();
})();
</script>
</body>
</html>
