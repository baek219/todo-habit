<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI 비서 · 생활노트</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#F3F4F6" />
<link rel="stylesheet" href="life.css?v=20261016a" />
<script>try{if(localStorage.getItem('dark_mode_v1')==='1')document.documentElement.classList.add('ln-dark')}catch(e){}</script>
<style>
  .page{padding-bottom:200px}
  .chat{display:flex;flex-direction:column;gap:12px;min-height:120px}
  .msg{max-width:min(560px,88%);padding:11px 14px;border-radius:18px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:6px}
  html.ln-dark .msg.me{color:#0E1116}
  .msg.ai{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px;display:grid;gap:10px;white-space:normal}
  .msg.ai .txt{white-space:pre-wrap}
  .msg.err{align-self:flex-start;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px}
  .msg.wait{align-self:flex-start;background:var(--surface);color:var(--muted)}
  .msg.wait span{display:inline-block;animation:blink 1.2s infinite both}
  .msg.wait span:nth-child(2){animation-delay:.2s}.msg.wait span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.msg.wait span{animation:none}}
  .acts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .acts li{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:8px 10px;font-size:14px}
  .acts li.undone{opacity:.5;text-decoration:line-through}
  .acts .tag{font-size:11.5px;font-weight:750;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--primary-soft);color:var(--primary)}
  .acts .tag.todo{background:#EEECFC;color:#5B4FD6} .acts .tag.expense{background:#FDECE6;color:#C1543D}
  .acts .tag.income{background:#E2F5EC;color:#0B8A5E} .acts .tag.shop{background:#E2F5EC;color:#0B8A5E}
  html.ln-dark .acts .tag.todo{background:#262446;color:#8F86F0} html.ln-dark .acts .tag.expense{background:#3A1F18;color:#F08A6E}
  html.ln-dark .acts .tag.income,html.ln-dark .acts .tag.shop{background:#15332A;color:#2FBF86}
  .acts .what{flex:1;min-width:0}
  .acts a{font-size:12.5px;white-space:nowrap}
  .msg-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .intro{display:grid;gap:12px}
  .intro .chips .chip{font-size:14px}
  .composer{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .composer form{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end}
  .composer textarea{resize:none;min-height:48px;max-height:140px;border-radius:16px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.45;
    background:var(--surface);color:var(--fg);border:1px solid var(--line);width:100%;box-sizing:border-box}
  .composer textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
  .composer .btn{height:48px;border-radius:16px}
  .mic{width:48px;padding:0;display:grid;place-items:center}
  .mic[aria-pressed="true"]{background:#C1543D;color:#fff;border-color:#C1543D}
  .composer .info{max-width:860px;margin:6px auto 0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
  .composer .info button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
  /* PC: 왼쪽 메뉴만큼 비켜서 / 폰: 아래 탭 메뉴 위로 */
  @media (min-width:960px){.composer{left:var(--ln-w,252px)}}
  @media (max-width:959.98px){html.ln-bnon .composer{bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:10px}}
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <span class="date" id="today"></span>
    <h1>AI 비서</h1>
    <p>말하듯 적으면 할 일·가계부·장보기에 대신 적어 드려요. 날씨와 옷차림도 물어보세요.</p>
  </header>

  <div class="note" id="gate" hidden></div>

  <section class="card intro" id="intro">
    <h2>이렇게 말해 보세요</h2>
    <div class="chips" id="examples"></div>
    <p class="small muted">한 번에 여러 개도 돼요. 예: "점심 9천원, 커피 4500원 썼고 내일 분리수거"<br />잘못 적혔으면 답 아래 <b>되돌리기</b>를 누르면 지워져요.</p>
  </section>

  <div class="chat" id="chat" aria-live="polite"></div>
</main>

<div class="composer">
  <form id="send" autocomplete="off">
    <textarea id="input" rows="1" maxlength="500" placeholder="예: 점심 9천원" aria-label="AI 비서에게 할 말"></textarea>
    <button class="btn soft mic" type="button" id="mic" hidden aria-pressed="false" aria-label="말로 입력">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
    </button>
    <button class="btn primary" type="submit" id="go">보내기</button>
  </form>
  <div class="info"><span id="left"></span><button type="button" id="clear">대화 지우기</button></div>
</div>

<script src="firebase.js?v=20261016a"></script>
<script src="sync.js?v=20261016a"></script>
<script src="life-config.js?v=20261016a"></script>
<script src="life.js?v=20261016a"></script>
<script src="shell.js?v=20261016a"></script>
<script>
(function () {
  const { h, today, won, prettyDate, toast, WD } = Life;
  const $ = id => document.getElementById(id);
  const M = Life.store('money'), S = Life.store('shop');
  const OUT_CATS = ['식비', '카페·간식', '장보기', '교통', '생활·주거', '쇼핑', '의료·건강', '반려동물', '문화·여가', '경조사', '기타'];
  const IN_CATS = ['월급', '용돈·부수입', '환급·기타'];
  const TASKS_KEY = 'todo_habit_tasks_v3';
  const LOG_KEY = 'life_chat_log_v1';
  $('today').textContent = prettyDate(today());

  /* ---------- 대화 기록 (이 기기에만, 최근 40개) ---------- */
  let log = [];
  try { const v = JSON.parse(localStorage.getItem(LOG_KEY)); if (v && Array.isArray(v.items)) log = v.items; } catch (e) {}
  function uidNow() { const u = Life.user(); return u ? u.uid : ''; }
  function saveLog() { log = log.slice(-40); try { localStorage.setItem(LOG_KEY, JSON.stringify({ uid: uidNow(), items: log })); } catch (e) {} }

  /* ---------- 할일·습관 기록 읽고 쓰기 (할일습관 화면과 같은 저장소) ---------- */
  function readTasks() { try { return JSON.parse(localStorage.getItem(TASKS_KEY) || '[]') || []; } catch (e) { return []; } }
  function writeTasks(t) {
    try { localStorage.setItem(TASKS_KEY, JSON.stringify(t)); } catch (e) { toast('이 기기에 저장 공간이 부족해요.'); }
    const CS = window.CloudSync; if (CS && CS.schedulePush) CS.schedulePush();
  }

  /* ---------- AI에게 보낼 '지금 기록' 요약 ---------- */
  function context() {
    const t = today(), ym = t.slice(0, 7), now = new Date();
    const money = M.items().filter(x => x.kind === 'out' || x.kind === 'in');
    const month = money.filter(x => (x.date || '').slice(0, 7) === ym);
    const out = month.filter(x => x.kind === 'out').reduce((a, x) => a + (Number(x.amount) || 0), 0);
    const inn = month.filter(x => x.kind === 'in').reduce((a, x) => a + (Number(x.amount) || 0), 0);
    const by = {}; month.filter(x => x.kind === 'out').forEach(x => { by[x.cat || '기타'] = (by[x.cat || '기타'] || 0) + (Number(x.amount) || 0); });
    const recent = money.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 15)
      .map(x => x.date + ' ' + (x.kind === 'in' ? '수입' : '지출') + ' ' + (x.cat || '') + ' ' + won(x.amount) + (x.memo ? ' ' + x.memo : ''));
    const shop = S.items().filter(x => !x.done).map(x => x.name + (x.qty ? ' ' + x.qty : ''));
    const todos = readTasks().filter(x => x.type === 'todo' && !x.done && !x.repeat)
      .sort((a, b) => (a.dueDate || '9').localeCompare(b.dueDate || '9'))
      .slice(0, 20).map(x => (x.dueDate || '날짜 없음') + (x.time ? ' ' + x.time : '') + ' ' + x.title + (x.important ? ' (중요)' : ''));
    const budget = Number(M.meta().budget) || 0;
    return {
      today: t, weekday: WD[now.getDay()], now: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
      monthOut: won(out), monthIn: won(inn), budget: budget ? won(budget) : '',
      byCat: Object.entries(by).sort((a, b) => b[1] - a[1]).map(([c, v]) => c + ' ' + won(v)),
      recentMoney: recent, shop, todos
    };
  }

  /* ---------- 날씨 (날씨·옷 이야기일 때만 붙여 보냄) ---------- */
  const WX_WORDS = /날씨|기온|온도|옷|입[고을지어는]|우산|비 ?[와오올온]|비가|눈 ?[와오올온]|추[워운울]|춥|더[워운울]|덥|쌀쌀|미세|먼지|바람|맑|흐[려림]|소나기|장마|태풍|외투|패딩|코트|반팔|반바지/;
  async function weatherLines() {
    const places = Life.weatherPlaces().slice(0, 4), out = [];
    for (const p of places) {
      try {
        const w = await Life.weather(false, p);
        const o = Life.outfit ? Life.outfit(w) : null;
        const t = w.days[1];
        const tw = t && Life.outfit ? Life.outfit({ feels: Math.round((t.max + t.min) / 2), max: t.max, min: t.min, rain: t.rain, code: 0, wind: 0, humidity: 0 }) : null;
        out.push(p.name + (out.length ? '' : '(기본 지역)') + ' 지금: ' + w.label + ' ' + w.temp + '° (체감 ' + w.feels + '°), 오늘 최고 ' + w.max + '° 최저 ' + w.min + '°, 비 올 확률 ' + w.rain + '%, 습도 ' + w.humidity + '%, 바람 ' + w.wind + 'm/s'
          + (w.pm10 != null ? ', 미세먼지 ' + (Life.pmGrade(w.pm10, 'pm10') || [''])[0] : '') + (w.pm25 != null ? ', 초미세먼지 ' + (Life.pmGrade(w.pm25, 'pm25') || [''])[0] : '')
          + (o ? ' / 오늘 옷 추천: ' + o.items.join(', ') + (o.tips.length ? ' / 챙길 것: ' + o.tips.map(x => x.replace(/^\S+\s/, '')).join(' ') : '') : ''));
        if (t) out.push(p.name + ' 내일: ' + t.label + ' 최고 ' + t.max + '° 최저 ' + t.min + '°, 비 올 확률 ' + t.rain + '%' + (tw ? ' / 내일 옷 추천: ' + tw.items.join(', ') : ''));
      } catch (e) {}
    }
    return out;
  }

  /* ---------- AI가 정한 것을 실제로 적기 ---------- */
  function apply(a) {
    const t = today();
    if (a.type === 'todo') {
      const id = 't' + Date.now() + Math.random().toString(36).slice(2, 7);
      const tasks = readTasks();
      tasks.unshift({ id, type: 'todo', title: a.title.slice(0, 60), category: null, memo: '', done: false, createdAt: t, completedAt: null,
        dueDate: a.date || t, endDate: null, repeat: null, lunar: false, doneDates: [],
        time: a.time || null, remindBefore: a.time ? 0 : null, reminderTime: a.time || null, preAlert: null, important: !!a.important });
      writeTasks(tasks);
      return { kind: 'todo', id, label: '할 일', text: a.title + ' · ' + shortDate(a.date || t) + (a.time ? ' ' + a.time : '') + (a.important ? ' · 중요' : ''), href: 'index.html' };
    }
    if (a.type === 'expense' || a.type === 'income') {
      const inc = a.type === 'income';
      const cat = inc ? (IN_CATS.includes(a.cat) ? a.cat : '환급·기타') : (OUT_CATS.includes(a.cat) ? a.cat : '기타');
      const m = M.put({ kind: inc ? 'in' : 'out', amount: a.amount, cat, memo: a.title || '', date: a.date || t, src: 'ai' });
      return { kind: a.type, id: m.id, label: inc ? '수입' : '지출', text: cat + ' ' + won(a.amount) + (a.title ? ' · ' + a.title : '') + ((a.date || t) !== t ? ' · ' + shortDate(a.date) : ''), href: 'money.html' };
    }
    if (a.type === 'shop') {
      const same = S.items().find(x => !x.done && x.name === a.title);
      if (same) return { kind: 'shop', id: null, label: '장보기', text: a.title + ' · 이미 목록에 있어요', href: 'shop.html' };
      const it = S.put({ name: a.title, qty: a.qty || '', done: false });
      const f = Object.assign({}, S.meta().freq || {}); f[a.title] = (f[a.title] || 0) + 1;
      S.setMeta({ freq: Object.fromEntries(Object.entries(f).sort((x, y) => y[1] - x[1]).slice(0, 40)) });
      return { kind: 'shop', id: it.id, label: '장보기', text: a.title + (a.qty ? ' ' + a.qty : ''), href: 'shop.html' };
    }
    return null;
  }
  function undo(r) {
    if (!r.id) return;
    if (r.kind === 'todo') writeTasks(readTasks().filter(x => x.id !== r.id));
    else if (r.kind === 'shop') S.remove(r.id);
    else M.remove(r.id);
  }
  function shortDate(d) {
    const t = today();
    if (d === t) return '오늘';
    const n = Life.daysBetween(t, d);
    if (n === 1) return '내일'; if (n === 2) return '모레'; if (n === -1) return '어제';
    const x = new Date(d + 'T00:00:00');
    return (x.getMonth() + 1) + '/' + x.getDate() + '(' + WD[x.getDay()] + ')';
  }

  /* ---------- 화면 그리기 ---------- */
  const chat = $('chat');
  function bubble(m, i) {
    if (m.role === 'user') return h('div', { class: 'msg me' }, m.text);
    if (m.role === 'error') return h('div', { class: 'msg err', role: 'alert' }, m.text);
    const done = (m.results || []).filter(r => r.id);
    return h('div', { class: 'msg ai' },
      h('div', { class: 'txt' }, m.text),
      m.results && m.results.length ? h('ul', { class: 'acts' }, m.results.map(r => h('li', { class: m.undone && r.id ? 'undone' : '' },
        h('span', { class: 'tag ' + r.kind }, r.label), h('span', { class: 'what' }, r.text), h('a', { href: r.href }, '보기')))) : null,
      done.length ? h('div', { class: 'msg-foot' }, m.undone
        ? h('span', { class: 'tiny muted' }, '되돌렸어요')
        : h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { done.forEach(undo); m.undone = true; saveLog(); render(); toast('방금 적은 ' + done.length + '개를 지웠어요'); } }, '되돌리기')) : null);
  }
  function render(waiting) {
    $('intro').hidden = log.length > 0;
    chat.replaceChildren(...log.map(bubble), waiting ? h('div', { class: 'msg wait', 'aria-label': '답을 만드는 중' }, h('span', {}, '●'), ' ', h('span', {}, '●'), ' ', h('span', {}, '●')) : []);
    if (log.length || waiting) requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
  }

  const EX = ['오늘 날씨 어때? 뭐 입을까?', '점심 김치찌개 9천원', '내일 오후 3시 치과 예약', '우유랑 계란 2판 장보기에 넣어줘', '이번 달 얼마 썼어?'];
  $('examples').replaceChildren(...EX.map(t => h('button', { class: 'chip', type: 'button', onclick: () => send(t) }, t)));

  /* ---------- 로그인·서버 확인 ---------- */
  function gate() {
    const g = $('gate');
    if (!Life.hasServer()) { g.hidden = false; g.textContent = 'AI 비서는 중간 서버가 연결된 뒤에 쓸 수 있어요.'; return false; }
    if (!Life.user()) { g.hidden = false; g.replaceChildren('AI 비서는 로그인한 분만 쓸 수 있어요. ', h('button', { class: 'btn sm', type: 'button', onclick: () => Life.signIn() }, 'Google로 로그인')); return false; }
    g.hidden = true; return true;
  }
  Life.onUser(u => {
    // 다른 계정으로 바뀌면 대화 기록을 비움
    try { const v = JSON.parse(localStorage.getItem(LOG_KEY)); if (u && v && v.uid && v.uid !== u.uid) { log = []; saveLog(); } } catch (e) {}
    gate(); render();
  });

  /* ---------- 보내기 ---------- */
  let busy = false;
  async function send(text) {
    text = String(text || '').trim();
    if (!text || busy) return;
    if (!gate()) { toast('먼저 로그인해 주세요'); return; }
    busy = true; $('go').disabled = true;
    const history = log.filter(m => m.role === 'user' || m.role === 'ai').slice(-6).map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', text: m.text }));
    log.push({ role: 'user', text, at: Date.now() }); saveLog();
    $('input').value = ''; grow(); render(true);
    try {
      const ctx = context();
      if (WX_WORDS.test(text)) ctx.weather = await weatherLines();
      const r = await Life.api('chat', { body: { message: text, history, context: ctx } });
      const results = (r.actions || []).map(a => { try { return apply(a); } catch (e) { console.error(e); return null; } }).filter(Boolean);
      log.push({ role: 'ai', text: r.reply || '적었어요.', results, at: Date.now() });
      if (r.limit != null) $('left').textContent = '오늘 ' + r.remaining + '번 더 쓸 수 있어요';
    } catch (e) {
      log.push({ role: 'error', text: e.message || '문제가 생겼어요. 다시 보내 주세요.', at: Date.now() });
      if (e.code === 'daily_limit') $('left').textContent = '오늘 쓸 수 있는 횟수를 다 썼어요';
    }
    saveLog(); busy = false; $('go').disabled = false; render();
  }
  $('send').addEventListener('submit', e => { e.preventDefault(); send($('input').value); });
  const inp = $('input');
  function grow() { inp.style.height = 'auto'; inp.style.height = Math.min(140, inp.scrollHeight) + 'px'; }
  inp.addEventListener('input', grow);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(inp.value); } });

  let armed = false;
  $('clear').onclick = () => {
    if (!log.length) return;
    if (!armed) { armed = true; $('clear').textContent = '한 번 더 누르면 지워요'; setTimeout(() => { armed = false; $('clear').textContent = '대화 지우기'; }, 3000); return; }
    log = []; saveLog(); armed = false; $('clear').textContent = '대화 지우기'; render(); toast('대화를 지웠어요 (적은 기록은 그대로예요)');
  };

  /* ---------- 말로 입력 (지원하는 브라우저만) ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const mic = $('mic'); mic.hidden = false;
    let rec = null;
    mic.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.maxAlternatives = 1;
      const before = inp.value ? inp.value.trim() + ' ' : '';
      rec.onresult = ev => { let s = ''; for (const r of ev.results) s += r[0].transcript; inp.value = before + s; grow(); };
      rec.onerror = ev => { if (ev.error === 'not-allowed') toast('마이크 사용을 허용해 주세요'); };
      rec.onend = () => { rec = null; mic.setAttribute('aria-pressed', 'false'); inp.focus(); };
      mic.setAttribute('aria-pressed', 'true'); rec.start();
    };
  }

  render();
})();
</script>
</body>
</html>
