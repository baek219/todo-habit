<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>가계부 · 생활노트</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#F3F4F6" />
<link rel="stylesheet" href="life.css?v=20261009v" />
<script>try{if(localStorage.getItem('dark_mode_v1')==='1')document.documentElement.classList.add('ln-dark')}catch(e){}</script>
<style>
  .month-nav{display:flex;align-items:center;gap:6px}
  .month-nav b{font-size:18px;font-weight:800;min-width:118px;text-align:center}
  .amount-input{font-size:22px!important;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
  .cat-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
  .cat-row .bar{height:10px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .day-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:14px 2px 4px;border-bottom:1px solid var(--line)}
  .tx{cursor:pointer}
  .tx:hover{background:var(--surface2)}
  .tx .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tx .amt.in{color:var(--good)}
  .quick-amts{display:flex;gap:6px;flex-wrap:wrap}
  @media (max-width:420px){.cat-row{grid-template-columns:86px 1fr auto}}
  /* 달마다 쓴 돈: 한 가지 색, 보고 있는 달만 진하게 */
  .trend{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:180px;padding-top:22px;border-bottom:1px solid var(--line)}
  .trend button{all:unset;cursor:pointer;height:100%;display:grid;grid-template-rows:1fr auto;align-items:end;justify-items:center;position:relative;border-radius:8px}
  .trend button:focus-visible{outline:2px solid var(--sec);outline-offset:2px}
  .trend .col{width:min(100%,44px);background:var(--sec-soft);border-radius:4px 4px 0 0;min-height:2px;transition:background .15s}
  .trend button:hover .col{background:color-mix(in srgb,var(--sec) 45%,var(--sec-soft))}
  .trend button[aria-current="true"] .col{background:var(--sec)}
  .trend .v{position:absolute;top:-20px;font-size:12px;font-weight:750;color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums}
  .trend .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:650;padding:6px 9px;border-radius:9px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:2}
  .trend button:nth-child(-n+2) .tip{left:0;transform:none}
  .trend button:nth-last-child(-n+2) .tip{left:auto;right:0;transform:none}
  .trend .tip{visibility:hidden}
  .trend button:hover .tip,.trend button:focus-visible .tip{opacity:1;visibility:visible}
  .trend-x{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:6px;font-size:12px;color:var(--muted);text-align:center}
  .trend-x .on{color:var(--fg);font-weight:750}
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <span class="date" id="today"></span>
    <h1>가계부</h1>
    <p id="sub">쓴 돈을 바로바로 적어두면 한 달 흐름이 보여요.</p>
  </header>

  <section class="card" aria-labelledby="add-title">
    <div class="card-head">
      <h2 id="add-title">빠르게 적기</h2>
      <div class="seg" role="group" aria-label="수입·지출">
        <button type="button" id="t-out" aria-pressed="true">지출</button>
        <button type="button" id="t-in" aria-pressed="false">수입</button>
      </div>
    </div>
    <form id="add-form" class="stack" autocomplete="off">
      <label class="field"><span class="label">금액 (원)</span>
        <input class="amount-input" id="f-amount" type="text" inputmode="numeric" placeholder="0" required /></label>
      <div class="quick-amts" id="quick-amts"></div>
      <div class="field"><span class="label">분류</span><div id="f-cats"></div></div>
      <div class="grid2" style="gap:10px">
        <label class="field"><span class="label">내용</span><input id="f-memo" type="text" maxlength="60" placeholder="예: 점심 김치찌개" /></label>
        <label class="field"><span class="label">날짜</span><input id="f-date" type="date" /></label>
      </div>
      <div class="row"><button class="btn primary" type="submit">저장</button><span class="small muted" id="add-hint"></span></div>
    </form>
  </section>

  <section class="card" aria-labelledby="sum-title">
    <div class="card-head">
      <div class="month-nav">
        <button class="btn sm" type="button" id="prev" aria-label="이전 달">◀</button>
        <b id="month-label" class="num"></b>
        <button class="btn sm" type="button" id="next" aria-label="다음 달">▶</button>
      </div>
      <button class="btn sm soft" type="button" id="budget-btn">예산 정하기</button>
    </div>
    <h2 id="sum-title" class="small muted" style="font-weight:700">이번 달 요약</h2>
    <div class="stat-row">
      <div class="stat"><span class="label">쓴 돈</span><b id="s-out">0원</b></div>
      <div class="stat"><span class="label">들어온 돈</span><b id="s-in">0원</b></div>
      <div class="stat"><span class="label">하루 평균 지출</span><b id="s-avg">0원</b></div>
      <div class="stat"><span class="label">지난달보다</span><b id="s-diff">-</b></div>
    </div>
    <div id="budget-box" class="stack"></div>
  </section>

  <section class="card" aria-labelledby="fixed-title">
    <div class="card-head"><h2 id="fixed-title">매달 나가는 돈</h2><button class="btn sm soft" type="button" id="fixed-add">+ 고정 지출</button></div>
    <p class="small muted">통신비·구독료·보험처럼 매달 같은 날 나가는 돈을 적어두면, 등록한 다음부터 그날이 되면 내역에 자동으로 들어가요.</p>
    <ul class="list" id="fixed"></ul>
  </section>

  <section class="card" aria-labelledby="trend-title">
    <div class="card-head"><h2 id="trend-title">달마다 쓴 돈</h2><span class="small muted" id="trend-sub"></span></div>
    <div class="trend" id="trend" role="list"></div>
    <p class="small muted" id="trend-note"></p>
  </section>

  <section class="card" aria-labelledby="cat-title">
    <h2 id="cat-title">어디에 많이 썼나</h2>
    <div id="cats" class="stack"></div>
  </section>

  <section class="card" aria-labelledby="list-title">
    <div class="card-head"><h2 id="list-title">내역</h2>
      <select id="filter" style="width:auto" aria-label="분류로 거르기"><option value="">전체 분류</option></select></div>
    <div id="list"></div>
  </section>
</main>

<script src="firebase.js?v=20261009v"></script>
<script src="sync.js?v=20261009v"></script>
<script src="life-config.js?v=20261009v"></script>
<script src="life.js?v=20261009v"></script>
<script src="shell.js?v=20261009v"></script>
<script src="import.js?v=20261009v"></script>
<script>
(function () {
  const { h, today, won, prettyDate, toast, sheet } = Life;
  const S = Life.store('money');
  const CATS = [
    ['식비', '#E8734A'], ['카페·간식', '#C88400'], ['장보기', '#2E8B57'], ['교통', '#0072B2'], ['생활·주거', '#5B5FC7'],
    ['쇼핑', '#B8558F'], ['의료·건강', '#C1543D'], ['반려동물', '#8A6D3B'], ['문화·여가', '#009E73'], ['경조사', '#7A7F87'], ['기타', '#9AA59E']
  ];
  const IN_CATS = [['월급', '#2E8B57'], ['용돈·부수입', '#009E73'], ['환급·기타', '#9AA59E']];
  const color = c => (CATS.concat(IN_CATS).find(x => x[0] === c) || [, '#9AA59E'])[1];
  let kind = 'out', cat = '식비', ym = today().slice(0, 7);

  const $ = id => document.getElementById(id);
  $('today').textContent = prettyDate(today());
  $('f-date').value = today();

  /* 입력 */
  const parseAmt = v => parseInt(String(v).replace(/[^\d]/g, ''), 10) || 0;
  $('f-amount').addEventListener('input', e => { const n = parseAmt(e.target.value); e.target.value = n ? n.toLocaleString('ko-KR') : ''; });
  [5000, 10000, 30000, 50000].forEach(n => $('quick-amts').append(h('button', { type: 'button', class: 'chip', onclick: () => { $('f-amount').value = (parseAmt($('f-amount').value) + n).toLocaleString('ko-KR'); } }, '+' + (n / 10000 >= 1 ? n / 10000 + '만' : n / 1000 + '천'))));
  // 분류: 버튼으로 고르거나 "+ 직접 쓰기"
  const usedCats = k => Life.usedValues(S.items().filter(t => (k === 'out' ? t.kind !== 'in' : t.kind === 'in')), 'cat', (k === 'out' ? CATS : IN_CATS).map(c => c[0]));
  function drawCats() {
    const list = (kind === 'out' ? CATS : IN_CATS).map(c => c[0]), used = usedCats(kind);
    if (!list.includes(cat) && !used.includes(cat)) cat = list[0];
    $('f-cats').replaceChildren(Life.choice({ options: list, value: cat, onChange: v => { cat = v; }, extra: used, placeholder: kind === 'out' ? '예: 육아, 술·모임, 자동차' : '예: 중고 판매, 이자' }).el);
  }
  function setKind(k) { kind = k; $('t-out').setAttribute('aria-pressed', String(k === 'out')); $('t-in').setAttribute('aria-pressed', String(k === 'in')); drawCats(); }
  $('t-out').onclick = () => setKind('out'); $('t-in').onclick = () => setKind('in');
  $('add-form').addEventListener('submit', e => {
    e.preventDefault();
    const amount = parseAmt($('f-amount').value);
    if (!amount) { toast('금액을 넣어 주세요'); $('f-amount').focus(); return; }
    const date = $('f-date').value || today();
    if (!cat) cat = kind === 'out' ? '기타' : '환급·기타';
    S.put({ kind, amount, cat, memo: $('f-memo').value.trim(), date });
    toast(won(amount) + ' ' + (kind === 'out' ? '지출' : '수입') + ' 저장했어요');
    $('f-amount').value = ''; $('f-memo').value = '';
    ym = date.slice(0, 7); drawCats(); render();
  });

  /* 달 이동 */
  function shift(n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); render(); }
  $('prev').onclick = () => shift(-1); $('next').onclick = () => shift(1);

  /* 예산 */
  $('budget-btn').onclick = () => {
    const inp = h('input', { type: 'text', inputmode: 'numeric', class: 'amount-input', value: (S.meta().budget || '') ? Number(S.meta().budget).toLocaleString('ko-KR') : '', placeholder: '예: 1,500,000' });
    inp.addEventListener('input', () => { const n = parseAmt(inp.value); inp.value = n ? n.toLocaleString('ko-KR') : ''; });
    const close = sheet('한 달 예산', h('div', { class: 'stack' },
      h('label', { class: 'field' }, h('span', { class: 'label' }, '매달 쓸 수 있는 돈 (지출 기준)'), inp),
      h('p', { class: 'small muted' }, '비워두고 저장하면 예산을 끄게 돼요.'),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => { S.setMeta({ budget: parseAmt(inp.value) || 0 }); close(); toast('예산을 저장했어요'); } }, '저장'))));
  };

  /* 수정 */
  function edit(t) {
    const amt = h('input', { type: 'text', inputmode: 'numeric', class: 'amount-input', value: t.amount.toLocaleString('ko-KR') });
    amt.addEventListener('input', () => { const n = parseAmt(amt.value); amt.value = n ? n.toLocaleString('ko-KR') : ''; });
    const list = (t.kind === 'in' ? IN_CATS : CATS).map(c => c[0]);
    const sel = Life.choice({ options: list, value: t.cat, extra: usedCats(t.kind === 'in' ? 'in' : 'out'), placeholder: '예: 육아' });
    const memo = h('input', { type: 'text', maxlength: '60', value: t.memo || '' });
    const date = h('input', { type: 'date', value: t.date });
    let armed = false;
    const del = h('button', { class: 'btn ghost', type: 'button', onclick: () => {
      if (!armed) { armed = true; del.textContent = '한 번 더 누르면 삭제'; del.style.color = 'var(--danger)'; return; }
      S.remove(t.id); close(); toast('삭제했어요');
    } }, '삭제');
    const close = sheet('내역 고치기', h('div', { class: 'stack' },
      h('label', { class: 'field' }, h('span', { class: 'label' }, '금액'), amt),
      h('div', { class: 'field' }, h('span', { class: 'label' }, '분류'), sel.el),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '내용'), memo),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '날짜'), date),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => {
        const a = parseAmt(amt.value); if (!a) { toast('금액을 넣어 주세요'); return; }
        S.put(Object.assign({}, t, { amount: a, cat: sel.get() || (t.kind === 'in' ? '환급·기타' : '기타'), memo: memo.value.trim(), date: date.value || t.date })); close(); toast('고쳤어요');
      } }, '저장'), h('span', { class: 'spacer' }), del)));
  }

  /* 고정 지출 */
  const fixedItems = () => S.items().filter(t => t.kind === 'fixed');
  function fixedForm(f) {
    f = f || {};
    const name = h('input', { type: 'text', maxlength: '30', value: f.name || '', placeholder: '예: 휴대폰 요금, 넷플릭스' });
    const amt = h('input', { type: 'text', inputmode: 'numeric', class: 'amount-input', value: f.amount ? f.amount.toLocaleString('ko-KR') : '' });
    amt.addEventListener('input', () => { const n = parseAmt(amt.value); amt.value = n ? n.toLocaleString('ko-KR') : ''; });
    const sel = Life.choice({ options: CATS.map(c => c[0]), value: f.cat || '생활·주거', extra: usedCats('out'), placeholder: '예: 구독, 보험' });
    const day = h('select', {}, Array.from({ length: 31 }, (_, i) => h('option', { value: i + 1, selected: (i + 1) === (f.day || 25) }, (i + 1) + '일' + (i + 1 >= 29 ? ' (없는 달은 말일)' : ''))));
    let armed = false;
    const del = f.id ? h('button', { class: 'btn ghost', type: 'button', onclick: () => {
      if (!armed) { armed = true; del.textContent = '한 번 더 누르면 삭제 (이미 들어간 내역은 남아요)'; del.style.color = 'var(--danger)'; return; }
      S.remove(f.id); close(); toast('고정 지출을 지웠어요');
    } }, '삭제') : null;
    const close = sheet(f.id ? '고정 지출 고치기' : '고정 지출 추가', h('div', { class: 'stack' },
      h('label', { class: 'field' }, h('span', { class: 'label' }, '이름'), name),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '금액 (원)'), amt),
      h('div', { class: 'field' }, h('span', { class: 'label' }, '분류'), sel.el),
      h('label', { class: 'field' }, h('span', { class: 'label' }, '매달 나가는 날'), day),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => {
        const a = parseAmt(amt.value);
        if (!name.value.trim() || !a) { toast('이름과 금액을 넣어 주세요'); return; }
        S.put(Object.assign({}, f, { kind: 'fixed', name: name.value.trim(), amount: a, cat: sel.get() || '기타', day: Number(day.value), start: f.start || today() }));
        close(); toast('저장했어요. 매달 ' + day.value + '일에 자동으로 들어가요');
      } }, '저장'), h('span', { class: 'spacer' }), del)));
  }
  $('fixed-add').onclick = () => fixedForm();
  // 이번 달·지난달 중 날짜가 지난 고정 지출을 내역에 넣음 (같은 달엔 한 번만, 지운 건 다시 안 넣음)
  function ensureFixed() {
    const now = today(), cur = now.slice(0, 7);
    fixedItems().forEach(f => {
      [prevYm(cur), cur].forEach(m => {
        const [y, mm] = m.split('-').map(Number);
        const d = Math.min(f.day || 1, new Date(y, mm, 0).getDate());
        const date = m + '-' + String(d).padStart(2, '0');
        if (date > now || (f.start && date < f.start)) return; // 등록한 날 이후부터만
        const id = 'fx_' + f.id + '_' + m;
        if (S.exists(id)) return;
        S.put({ id, kind: 'out', amount: f.amount, cat: f.cat, memo: f.name + ' (매달)', date, fixedId: f.id });
      });
    });
  }

  /* 그리기 */
  function monthItems(m) { return S.items().filter(t => (t.date || '').slice(0, 7) === m); }
  function prevYm(m) { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function drawTrend() {
    const [y, m] = ym.split('-').map(Number);
    const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(y, m - 6 + i, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); });
    const sums = months.map(k => monthItems(k).filter(t => t.kind !== 'in').reduce((a, t) => a + t.amount, 0));
    const max = Math.max(...sums, 1);
    const short = n => n >= 10000 ? (Math.round(n / 1000) / 10) + '만' : n.toLocaleString('ko-KR');
    $('trend').replaceChildren(...months.map((k, i) => h('button', { type: 'button', role: 'listitem', 'aria-current': String(k === ym), 'aria-label': Number(k.slice(5)) + '월 ' + won(sums[i]), onclick: () => { ym = k; render(); } },
      k === ym ? h('span', { class: 'v' }, short(sums[i])) : null,
      h('span', { class: 'tip' }, k.slice(0, 4) + '년 ' + Number(k.slice(5)) + '월 · ' + won(sums[i])),
      h('i', { class: 'col', style: 'height:' + Math.max(1, sums[i] / max * 100) + '%' }))));
    let x = document.getElementById('trend-x');
    if (!x) { x = h('div', { class: 'trend-x', id: 'trend-x', 'aria-hidden': 'true' }); $('trend').after(x); }
    x.replaceChildren(...months.map(k => h('span', { class: k === ym ? 'on' : '' }, Number(k.slice(5)) + '월')));
    const cur = sums[5], prev = sums[4], used = sums.filter(Boolean);
    const avg = used.length ? Math.round(used.reduce((a, b) => a + b, 0) / used.length) : 0;
    $('trend-sub').textContent = used.length ? '6개월 평균 ' + won(avg) : '';
    $('trend-note').textContent = !cur && !prev ? '지출을 적으면 달마다 얼마 썼는지 막대로 보여요. 막대를 누르면 그달로 가요.'
      : !prev ? '지난달 기록이 없어서 비교할 수 없어요.'
      : cur > prev ? '지난달보다 ' + won(cur - prev) + ' 더 썼어요.' : cur < prev ? '지난달보다 ' + won(prev - cur) + ' 덜 썼어요.' : '지난달과 똑같이 썼어요.';
  }

  function render() {
    drawTrend();
    $('sub').textContent = S.isShared() ? '가족과 같이 쓰는 가계부예요. 누가 적어도 여기 모여요.' : '쓴 돈을 바로바로 적어두면 한 달 흐름이 보여요.';
    const [y, m] = ym.split('-').map(Number);
    $('month-label').textContent = y + '년 ' + m + '월';
    const items = monthItems(ym);
    const out = items.filter(t => t.kind !== 'in').reduce((s, t) => s + t.amount, 0);
    const inc = items.filter(t => t.kind === 'in').reduce((s, t) => s + t.amount, 0);
    const isCur = ym === today().slice(0, 7);
    const days = isCur ? new Date().getDate() : new Date(y, m, 0).getDate();
    $('s-out').textContent = won(out); $('s-in').textContent = won(inc);
    $('s-avg').textContent = won(days ? out / days : 0);
    const prevOut = monthItems(prevYm(ym)).filter(t => t.kind !== 'in').reduce((s, t) => s + t.amount, 0);
    $('s-diff').textContent = prevOut ? (out >= prevOut ? '+' : '−') + won(Math.abs(out - prevOut)) : '-';

    const budget = Number(S.meta().budget) || 0;
    const bb = $('budget-box'); bb.replaceChildren();
    if (budget) {
      const pct = Math.min(100, Math.round(out / budget * 100));
      const left = budget - out;
      let line = left >= 0 ? '예산 ' + won(budget) + ' 중 ' + won(left) + ' 남았어요' : '예산보다 ' + won(-left) + ' 더 썼어요';
      if (isCur && left > 0) { const remainDays = new Date(y, m, 0).getDate() - new Date().getDate() + 1; line += ' · 남은 ' + remainDays + '일 동안 하루 ' + won(left / remainDays); }
      bb.append(h('div', { class: 'bar' + (left < 0 ? ' over' : ''), role: 'img', 'aria-label': '예산 사용 ' + pct + '%' }, h('i', { style: 'width:' + pct + '%' })), h('p', { class: 'small' + (left < 0 ? '' : ' muted') }, line));
    }

    // 고정 지출 목록
    const fx = fixedItems().sort((a, b) => (a.day || 0) - (b.day || 0));
    const fxSum = fx.reduce((t, f) => t + f.amount, 0);
    $('fixed').replaceChildren(...(fx.length ? fx.map(f => h('li', { class: 'tx', tabindex: '0', role: 'button', onclick: () => fixedForm(f), onkeydown: e => { if (e.key === 'Enter') fixedForm(f); } },
      h('span', { class: 'badge', style: 'min-width:46px;justify-content:center' }, '매달 ' + f.day + '일'),
      h('div', { class: 'grow' }, h('div', { style: 'font-weight:600' }, f.name), h('div', { class: 'tiny muted' }, f.cat)),
      h('span', { class: 'amt' }, won(f.amount)))).concat([h('li', {}, h('div', { class: 'grow small muted' }, '한 달 합계'), h('b', { class: 'num' }, won(fxSum)))])
      : [h('li', { class: 'empty' }, '"+ 고정 지출"을 눌러 매달 나가는 돈을 등록해 보세요.')]));

    // 분류별
    const by = {};
    items.filter(t => t.kind !== 'in').forEach(t => { by[t.cat] = (by[t.cat] || 0) + t.amount; });
    const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
    const top = rows.length ? rows[0][1] : 0;
    $('cats').replaceChildren(...(rows.length ? rows.map(([c, v]) => h('div', { class: 'cat-row' },
      h('span', { class: 'row', style: 'gap:6px;flex-wrap:nowrap' }, h('i', { class: 'dot', style: 'background:' + color(c) }), c),
      h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.max(3, v / top * 100) + '%;background:' + color(c) })),
      h('span', { class: 'num small' }, won(v) + ' · ' + Math.round(v / out * 100) + '%'))) : [h('p', { class: 'empty' }, '이 달에 적은 지출이 없어요.')]));

    // 거르기
    const f = $('filter'); const fv = f.value;
    const usedCats = [...new Set(items.map(t => t.cat))];
    f.replaceChildren(h('option', { value: '' }, '전체 분류'), ...usedCats.map(c => h('option', { value: c, selected: c === fv }, c)));
    const shown = items.filter(t => !f.value || t.cat === f.value).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
    const list = $('list'); list.replaceChildren();
    if (!shown.length) { list.append(h('p', { class: 'empty' }, '위 "빠르게 적기"에 금액을 넣고 저장하면 여기에 쌓여요.')); return; }
    let curDay = null, ul = null;
    shown.forEach(t => {
      if (t.date !== curDay) {
        curDay = t.date;
        const dayOut = shown.filter(x => x.date === curDay && x.kind !== 'in').reduce((s, x) => s + x.amount, 0);
        list.append(h('div', { class: 'day-head' }, h('span', {}, prettyDate(curDay)), h('span', { class: 'num' }, dayOut ? '−' + won(dayOut) : '')));
        ul = h('ul', { class: 'list' }); list.append(ul);
      }
      ul.append(h('li', { class: 'tx', tabindex: '0', role: 'button', 'aria-label': t.cat + ' ' + won(t.amount) + ' 고치기', onclick: () => edit(t), onkeydown: e => { if (e.key === 'Enter') edit(t); } },
        h('i', { class: 'dot', style: 'background:' + color(t.cat) }),
        h('div', { class: 'grow' }, h('div', { style: 'font-weight:600' }, t.memo || t.cat), t.memo ? h('div', { class: 'tiny muted' }, t.cat) : null),
        h('span', { class: 'amt' + (t.kind === 'in' ? ' in' : '') }, (t.kind === 'in' ? '+' : '−') + won(t.amount))));
    });
  }
  $('filter').onchange = render;
  drawCats();

  // 엑셀로 넣기·받기
  const allCats = CATS.concat(IN_CATS).map(c => [c[0]]);
  allCats.find(c => c[0] === '식비').push('식사', '외식', '밥', '점심', '저녁', '배달');
  allCats.find(c => c[0] === '카페·간식').push('카페', '커피', '간식', '디저트');
  allCats.find(c => c[0] === '장보기').push('마트', '식료품', '장');
  allCats.find(c => c[0] === '교통').push('주유', '택시', '버스', '지하철', '기름', '차량');
  allCats.find(c => c[0] === '생활·주거').push('관리비', '월세', '공과금', '통신', '전기', '가스', '생활', '주거', '보험');
  allCats.find(c => c[0] === '의료·건강').push('병원', '약국', '의료', '건강');
  allCats.find(c => c[0] === '문화·여가').push('영화', '여행', '취미', '문화', '여가', '구독');
  allCats.find(c => c[0] === '월급').push('급여', '월급여', '상여');
  const catSet = new Set(CATS.map(c => c[0])), inSet = new Set(IN_CATS.map(c => c[0]));
  // 분류 칸이 없을 때 가게 이름으로 짐작 (카드사 엑셀용)
  const GUESS = [['카페·간식', /스타벅스|커피|카페|투썸|이디야|메가|빽다방|컴포즈|베이커리|파리바게|뚜레쥬르|배스킨|던킨|빵/], ['장보기', /이마트|홈플러스|롯데마트|코스트코|트레이더스|마트|쿠팡|마켓컬리|컬리|농협|하나로/], ['교통', /카카오T|택시|주유|오일|GS칼텍스|SK에너지|S-OIL|현대오일|티머니|코레일|SRT|고속|버스|지하철|주차|하이패스/i], ['식비', /배달의민족|배민|요기요|쿠팡이츠|식당|김밥|치킨|피자|맥도날드|버거|국밥|분식|한식|중식|일식|고기|맘스터치|롯데리아/], ['의료·건강', /병원|의원|약국|치과|한의원|안과|피부과/], ['생활·주거', /관리비|전기|가스|수도|통신|SKT|KT|LG유플러스|보험|다이소/i], ['문화·여가', /CGV|메가박스|롯데시네마|넷플릭스|유튜브|멜론|티빙|웨이브|스팀|넥슨|여행|호텔|야놀자|여기어때/i], ['반려동물', /동물병원|펫|애견|사료/], ['쇼핑', /무신사|지그재그|올리브영|11번가|G마켓|옥션|SSG|백화점|아울렛/i]];
  const guessCat = memo => (GUESS.find(([, re]) => re.test(memo)) || ['기타'])[0];
  Life.excel({ store: S, title: '가계부',
    fields: [
      { key: 'date', label: '날짜', type: 'date', aliases: ['일자', '거래일', '거래일자', '거래일시', '사용일', '이용일', '승인일'] },
      { key: 'kind', label: '구분', type: 'choice', aliases: ['수입지출', '입출', '거래구분', '유형'], options: [['out', '지출', '출금', '나감', '사용', '결제', '승인'], ['in', '수입', '입금', '들어옴', '환급']], out: x => x.kind === 'in' ? '수입' : '지출', fixedOptions: ['지출', '수입'] },
      { key: 'amount', label: '금액', type: 'amount', aliases: ['이용금액', '사용금액', '결제금액', '거래금액', '원'] },
      { key: 'outAmt', label: '출금액', type: 'amount', aliases: ['출금', '지출금액', '찾으신금액'], noExport: true },
      { key: 'inAmt', label: '입금액', type: 'amount', aliases: ['입금', '수입금액', '맡기신금액'], noExport: true },
      { key: 'cat', label: '분류', type: 'choice', aliases: ['카테고리', '항목', '종류', '업종'], options: allCats },
      { key: 'memo', label: '내용', type: 'text', aliases: ['메모', '적요', '가맹점', '가맹점명', '이용가맹점', '사용처', '내역', '거래처', '비고'] }
    ],
    toItem(v) {
      let kind = v.kind, amount = v.amount;
      if (!amount && v.outAmt) { amount = v.outAmt; kind = 'out'; }
      if (!amount && v.inAmt) { amount = v.inAmt; kind = 'in'; }
      if (!amount) return { error: '금액이 없어요' };
      if (amount < 0) { amount = -amount; if (!kind) kind = 'out'; }
      kind = kind || (v.cat && inSet.has(v.cat) ? 'in' : 'out');
      let cat = v.cat || (kind === 'out' ? guessCat(v.memo || '') : '');
      if (kind === 'out' && !catSet.has(cat)) cat = '기타';
      if (kind === 'in' && !inSet.has(cat)) cat = '환급·기타';
      return { kind, amount, cat, memo: v.memo || '', date: v.date || today() };
    },
    exportFilter: x => x.kind === 'in' || x.kind === 'out',
    exportSort: (a, b) => (a.date || '').localeCompare(b.date || ''),
    dupKey: x => x.kind === 'fixed' ? 'fixed' + x.id : [x.date, x.kind, x.amount, x.memo].join('|'),
    preview: [['날짜', x => x.date], ['구분', x => x.kind === 'in' ? '수입' : '지출'], ['금액', x => x.amount.toLocaleString('ko-KR') + '원'], ['분류', x => x.cat], ['내용', x => x.memo]],
    sample: [['2026-10-01', '지출', '9000', '식비', '점심 김치찌개'], ['2026-10-01', '수입', '3000000', '월급', '10월 월급']],
    note: '카드사·은행에서 내려받은 엑셀도 넣을 수 있어요. 분류 칸이 없으면 가게 이름을 보고 짐작하고, 모르겠으면 "기타"로 넣어요.'
  });
  S.subscribe(() => { ensureFixed(); render(); });
  ensureFixed();
  render();
})();
</script>
</body>
